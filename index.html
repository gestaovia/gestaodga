      if (type === 'manut_saida' && !DRAFT.doneItems.length) errs.push('Marque ao menos um serviço realizado.');
      if (['manut_entrada', 'manut_saida'].includes(type) && !shopOk(DRAFT.workshopId) && !(type === 'manut_saida' && DRAFT.workshopId && DRAFT.workshopId === v.maintenanceWorkshopId)) errs.unshift('Escolha a oficina credenciada.');
      if (type === 'manut_entrada' && (DRAFT.shop || '').length < 3) errs.unshift('Informe o motivo da manutenção.');
      if (errs.length) return showErrors(errs);
      const c = activeCustody(vid);
      saveFullChecklist(type, v, c?.driverId || null, c?.id || null, k);
      if (type === 'manut_entrada') { v.maintenance = true; v.maintenanceSince = nowTs(); v.maintenanceNote = DRAFT.shop; v.maintenanceWorkshopId = DRAFT.workshopId; log('manutencao', `Entrada em manutenção na ${shopName(DRAFT.workshopId)}: ${DRAFT.shop}`, { vehicleId: vid }); }
      if (type === 'manut_saida') {
        const cost = parseFloat(String(DRAFT.cost).replace(/\./g, '').replace(',', '.')) || 0;
        S.maintRecords.push({ id: uid('mr'), vehicleId: vid, at: nowTs(), items: DRAFT.doneItems, cost, shop: shopName(DRAFT.workshopId), workshopId: DRAFT.workshopId, km: k, type: 'preventiva', notes: v.maintenanceNote || '', planPrev: planSnapshot(vid, DRAFT.doneItems) });
        DRAFT.doneItems.forEach(i => S.plans.filter(p => p.vehicleId === vid && (p.item === i || (i === 'Alinhamento' && p.item === 'Balanceamento' && false))).forEach(p => { p.lastKm = k; p.lastDate = startOfDay(nowTs()); }));
        v.maintenance = false; v.maintenanceSince = null; v.maintenanceNote = ''; v.maintenanceWorkshopId = null;
        openIssues(vid).forEach(i => { i.status = 'resolvida'; i.resolvedAt = nowTs(); i.resolvedBy = CUR.id; i.resolution = `Resolvido na manutenção: ${DRAFT.doneItems.join(', ')}`; });
        log('manutencao', `Saída de manutenção (${shopName(DRAFT.workshopId)}): ${DRAFT.doneItems.join(', ')}${cost ? ' · ' + money(cost) : ''}`, { vehicleId: vid });
      }
      save(); toast('Checklist concluído.'); go(CUR.role === 'condutor' ? 'inicio' : 'veiculo', { id: vid });
    });
  }
};

        <div class="full stack" style="gap:8px">${singlePhoto('hodometro', 'Foto do hodômetro (obrigatória)')}${singlePhoto('cupom', 'Foto do cupom ou nota fiscal')}</div>

      <div class="panel"><div class="panel-h"><h3>Cálculo automático</h3></div><div class="panel-b" id="fuel-calc"></div></div>
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button class="btn ok lg block">Registrar abastecimento</button></div>
    </form>`;
  },
  mount() {
    const f = $('#fform'); if (!f) return; bindDraft(f);
    const num = s => parseFloat(String(s || '').replace(/\./g, '').replace(',', '.'));
    const calc = () => {
      const v = veh(DRAFT.vid); const k = parseInt(String(DRAFT.km).replace(/\D/g, ''), 10); const l = num(DRAFT.liters); const t = num(DRAFT.total);
      const prev = S.fuel.filter(x => x.vehicleId === v.id).sort((a, b) => b.at - a.at)[0];
      const avg = vehicleAvgKmL(v.id);
      let html = `<dl class="dl"><dt>Média do veículo</dt><dd class="num">${nf(avg, 1)} km/l</dd>`;
      if (prev) html += `<dt>Último abastecimento</dt><dd class="num">${km(prev.km)} · ${fmtShort(prev.at)}</dd>`;
      if (k && l && prev && k > prev.km) {
        const dist = k - prev.km, kml = dist / l, dev = (kml - avg) / avg * 100;
        const out = Math.abs(dev) > S.settings.fuelDeviationPct;
        html += `<dt>Distância</dt><dd class="num">${km(dist)}</dd><dt>Consumo</dt><dd class="num"><b>${nf(kml, 1)} km/l</b> ${out ? pill(`${dev > 0 ? '+' : ''}${nf(dev, 0)}% da média`, 'warn') : `<span class="muted">${dev > 0 ? '+' : ''}${nf(dev, 0)}% da média</span>`}</dd>`;
        if (t) html += `<dt>Custo por km</dt><dd class="num">${money(t / dist)}</dd>`;
      }
      if (l && t) html += `<dt>Preço por litro</dt><dd class="num">${money(t / l)}</dd>`;
      $('#fuel-calc').innerHTML = html + '</dl>';
    };
    DRAFT._onChange = calc; calc();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(DRAFT.vid); const c = activeCustody(v.id); const errs = [];
      const k = parseInt(String(DRAFT.km).replace(/\D/g, ''), 10); const l = num(DRAFT.liters); const t = num(DRAFT.total);
      if (!k) errs.push('Informe a quilometragem.'); else if (k < lastRecordedKm(v.id)) errs.push(`A quilometragem não pode ser menor que o último registro (${km(lastRecordedKm(v.id))}).`);
      if (!l || l <= 0) errs.push('Informe os litros.'); if (!t || t <= 0) errs.push('Informe o valor total.');
      if (!DRAFT.station) errs.push('Informe o posto.'); if (!DRAFT.photos.hodometro) errs.push('Envie a foto do hodômetro (vale pontos na premiação).'); if (!DRAFT.photos.cupom) errs.push('Envie a foto do cupom ou nota fiscal.');
      if (errs.length) return showErrors(errs);
      const seg = currentSegment(c);
      const rec = { id: uid('fuel'), vehicleId: v.id, driverId: c.driverId, custodyId: c.id, projectId: seg?.projectId || null, at: nowTs(), km: k, liters: l, total: t, fuelType: DRAFT.fuelType, station: DRAFT.station, receipt: DRAFT.photos.cupom, odoPhoto: DRAFT.photos.hodometro, location: DRAFT.geo };
      S.fuel.push(rec); v.odometer = Math.max(v.odometer, k);
      log('abastecimento', `Abastecimento: ${nf(l, 1)} L, ${money(t)} em ${rec.station}`, { vehicleId: v.id, driverId: c.driverId });
      const m = fuelOutlier(rec);
      if (m) notify('gestao', `Consumo fora do padrão no ${v.plate}: ${nf(m.kmL, 1)} km/l (${m.delta > 0 ? '+' : ''}${nf(m.delta, 0)}% da média).`, { level: 'warn', link: { page: 'abastecimento' } });
      save(); toast('Abastecimento registrado.'); go(CUR.role === 'condutor' ? 'inicio' : 'abastecimento');
    });
  }
};

  return `<div class="steps">${T_STATUS.map(([k, l], i) => `<div class="step ${i < cur || (t?.status === 'concluida') ? 'done' : ''} ${i === cur && t?.status !== 'concluida' ? 'cur' : ''}">${l}</div>`).join('')}</div>`;
}

/* ===================== Mapa (Leaflet + base vetorial real) ===================== */
let MAPS = [];
function destroyMaps() { MAPS.forEach(m => { try { m.remove(); } catch (e) { } }); MAPS = []; }
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const statusHex = c => ({ 'vs-free': cssVar('--u-yellow'), 'vs-drv': cssVar('--u-green'), 'vs-prob': cssVar('--u-red'), ok: cssVar('--green'), neu: cssVar('--blue'), warn: cssVar('--yellow'), urg: cssVar('--orange'), bad: cssVar('--red'), gray: cssVar('--text3') }[c] || cssVar('--text3'));
const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark';
function buildMap(el, vehicles, opts = {}) {
  if (!el) return null;
  if (!window.L) { el.innerHTML = '<div class="empty">Mapa indisponível: a biblioteca de mapas não carregou.</div>'; return null; }
  const map = L.map(el, { scrollWheelZoom: false, zoomSnap: .5, fadeAnimation: false, zoomAnimation: true, attributionControl: true, minZoom: 4, maxZoom: 19 });
  MAPS.push(map);
  map.createPane('vbase').style.zIndex = 150;
  map.createPane('vlabel').style.zIndex = 160;
  const BM = window.BASEMAP;
  if (BM) {
    L.geoJSON(BM.mun, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-line'), weight: 1, fillColor: cssVar('--map-mun'), fillOpacity: 1 } }).addTo(map);
    L.geoJSON(BM.urban, { pane: 'vbase', interactive: false, style: { stroke: false, fillColor: cssVar('--map-urban'), fillOpacity: 1 } }).addTo(map);
    L.geoJSON(BM.roads, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-road-case'), weight: 6, opacity: 1 } }).addTo(map);
    L.geoJSON(BM.roads, { pane: 'vbase', interactive: false, style: { color: cssVar('--map-road'), weight: 3.5, opacity: 1 } }).addTo(map);
    BM.mun.features.forEach(f => L.marker(f.properties.c, { pane: 'vlabel', interactive: false, icon: L.divIcon({ className: '', html: `<div class="mlabel">${esc(f.properties.n)}</div>`, iconSize: [0, 0] }) }).addTo(map));
  }
  // ruas do OpenStreetMap: livre, sem conta e sem chave de acesso. No modo escuro as cores são invertidas por CSS.
  // Sem internet ou se o serviço recusar, fica a base vetorial embutida acima (IBGE · Natural Earth).
  const tl = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'osm-tiles', attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' });
  let failed = 0;
  tl.on('tileerror', () => { if (++failed === 1) { map.removeLayer(tl); map.attributionControl.addAttribution('Base: IBGE · Natural Earth'); } });
  tl.addTo(map);
  const pts = [];
  if (opts.projects !== false) S.projects.filter(p => p.active && p.lat != null && p.lng != null).forEach(p => {
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="ppin"></div><div class="mlabel proj">${esc(p.code)}</div>`, iconSize: [0, 0] }) }).bindTooltip(`${esc(p.code)} · ${esc(p.name)}`).addTo(map);
    if (!opts.fitVehiclesOnly) pts.push([p.lat, p.lng]);
  });
  map._vm = {};
  vehicles.forEach(v => {
    const loc = lastLocation(v.id); if (!loc) return;
    const st = vStatus(v);
    const m = L.marker([loc.lat, loc.lng], { riseOnHover: true, zIndexOffset: 1000, icon: vehicleIcon(v, st) });
    m._st = st; m.bindPopup(() => vehiclePopup(v, lastLocation(v.id)));
    m.addTo(map); pts.push([loc.lat, loc.lng]); map._vm[v.id] = m;
  });
  if (pts.length > 1) map.fitBounds(pts, { padding: [36, 36], maxZoom: opts.maxZoom || 12, animate: false });
  else if (pts.length === 1) map.setView(pts[0], opts.zoom || 13, { animate: false });
  else map.setView([-22.9, -47.06], 11, { animate: false });
  setTimeout(() => { if (MAPS.includes(map)) map.invalidateSize({ animate: false }); }, 60);
  return map;
}
const vehicleIcon = (v, st) => L.divIcon({ className: '', html: `<div class="vpin"><i style="background:${statusHex(V_STATUS[st].c)}"></i><b>${v.plate}</b></div>`, iconSize: [0, 0] });
function vehiclePopup(v, loc) {
  const st = vStatus(v); const c = activeCustody(v.id); const seg = currentSegment(c); const t = S.locations[v.id];
  return `<div class="map-pop"><b>${v.plate}</b> · ${esc(v.model)}<br>${stTag(st)}<br>${c ? `${esc(drv(c.driverId).name)} · ${seg ? esc(prj(seg.projectId).code) : 'sem obra'}<br>` : ''}<span class="muted">${esc(loc.what)} · ${fmtShort(loc.at)}</span><br><button class="link" data-go="veiculo" data-id="${v.id}">Abrir veículo</button></div>`;
}

ACTIONS['veh-new'] = () => openVehicleForm(null);

ACTIONS['veh-save'] = a => {
  const d = formData($('#vform')); const p = d.plate.toUpperCase().replace(/[^A-Z0-9]/g, ''); const err = t => $('#vf-err').textContent = t;
  const edit = a.dataset.id ? veh(a.dataset.id) : null;
  if (!edit) { if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p)) return err('Placa inválida. Use o padrão ABC1D23 ou ABC1234.'); if (vehicleByPlate(p)) return err('Já existe um veículo com esta placa.'); }
  if (!d.brand || !d.model || !d.year || !d.odometer) return err('Preencha marca, modelo, ano e quilometragem.');
  const numv = x => parseFloat(String(x || '').replace(/\./g, '').replace(',', '.'));
  let rental = null;
  if (d.ownership === 'locada') {
    if (!d.company || !d.pickupDate || !d.dueDate) return err('Para veículo locado, informe locadora, data de retirada e prazo de devolução.');
    if (parseDate(d.dueDate) <= parseDate(d.pickupDate)) return err('O prazo de devolução deve ser depois da retirada.');
    rental = { ...(edit?.rental || { history: [] }), company: d.company, contract: d.contract, pickupDate: parseDate(d.pickupDate), dueDate: parseDate(d.dueDate), monthly: numv(d.monthly) || 0, status: 'ativa' };
  }
  const fields = { brand: d.brand, model: d.model, year: +d.year, fuelType: d.fuelType, seats: +d.seats || null, avgKmL: numv(d.avgKmL) || 10, odometer: Math.max(+String(d.odometer).replace(/\D/g, ''), edit?.odometer || 0), tracker: edit?.tracker ?? false, ownership: d.ownership, rental };
  if (edit) { Object.assign(edit, fields); log('cadastro', `Cadastro do veículo atualizado por ${CUR.name}`, { vehicleId: edit.id }); save(); closeModal(); toast('Veículo atualizado.'); return render(); }
  const id = uid('veh');
  S.vehicles.push({ id, plate: p, ...fields, maintenance: false, active: true });
  S.qrcodes.push({ id: uid('qr'), vehicleId: id, token: newToken(), active: true, createdAt: nowTs() });
  [['Troca de óleo', 10000, 180], ['Filtros', 10000, 180], ['Alinhamento', 10000, null], ['Balanceamento', 10000, null], ['Revisão', 15000, 365]].forEach(([it, k, dd]) => S.plans.push({ id: uid('mp'), vehicleId: id, item: it, everyKm: k, everyDays: dd, lastKm: fields.odometer, lastDate: startOfDay(nowTs()) }));
  log('cadastro', `Veículo ${p} cadastrado (${d.ownership === 'locada' ? 'locado' : 'frota própria'}) e QR Code gerado`, { vehicleId: id });
  save(); closeModal(); go('veiculo', { id });
};
const newToken = () => { const a = new Uint32Array(16); crypto.getRandomValues(a); return 'VLK1-' + [...a].map(n => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n % 32]).join(''); };

}

PAGES.forcar = {
  title: 'Transferência forçada',
  render({ vid }) {
    if (!isManager()) return '<div class="note bad">Exclusivo para gestores.</div>';
    const v = veh(vid); const c = activeCustody(vid);
    if (!c) return `<div class="note">O veículo ${plate(v.plate)} não possui posse ativa.</div>`;
    return `<form class="stack" id="fform" style="max-width:720px">
        <div class="panel"><div class="panel-b row" style="padding-top:16px;gap:14px">${plate(v.plate, true)}<div class="person">${av(drv(c.driverId), 'lg')}<div><b>${esc(drv(c.driverId).name)}</b><small>desde ${fmtDT(c.start)} · ${projLabel(currentSegment(c)?.projectId)}</small></div></div></div></div>
        <div class="note warn">${ic('alert')}<div>Ação administrativa: fica registrada com seu nome e a justificativa.</div></div>
        <div class="panel"><div class="panel-b form-grid" style="padding-top:16px">
          <label class="field"><span>Novo condutor</span><select class="inp" name="to"><option value="">Nenhum — devolver ao pátio</option>${driverOptions('', d => d.id !== c.driverId && driverActive(d))}</select><small>Ele fará o checklist de recebimento para assumir.</small></label>
          <label class="field"><span>Quilometragem</span><input class="inp num" name="km" inputmode="numeric" value="${suggestedKm(v)}"></label>
          <label class="field full"><span>Justificativa</span><textarea class="inp" name="just" placeholder="Por que a entrega não foi feita pelo condutor?"></textarea></label>
        </div></div>
        <div class="note bad" id="ck-err" hidden></div>
        <div class="row"><button type="button" class="btn" data-go="veiculo" data-id="${vid}">Cancelar</button><button class="btn ok">Confirmar transferência</button></div>
      </form>`;
  },
  mount({ vid }) {
    const f = $('#fform'); if (!f) return;
    f.addEventListener('submit', e => {
      e.preventDefault(); const d = formData(f); const v = veh(vid); const c = activeCustody(vid);
      const k = parseInt(d.km.replace(/\D/g, ''), 10); const errs = [];
      if (d.just.length < 15) errs.push('Escreva uma justificativa com pelo menos 15 caracteres.');
      if (!k || k < c.startKm) errs.push('Quilometragem inválida.');
      if (d.to && S.settings.oneVehiclePerDriver && driverCustodies(d.to).length) errs.push(`${drv(d.to).name} já está com outro veículo.`);
      if (errs.length) return showErrors(errs);
      const old = activeTransfer(vid); if (old) setTransfer(old, 'cancelada', 'Substituída por transferência forçada');
      c.end = nowTs(); c.endKm = k; c.closedReason = 'forcada'; v.odometer = Math.max(v.odometer, k);
      log('transferencia_forcada', `Transferência forçada por ${CUR.name}: posse de ${drv(c.driverId).name} encerrada${d.to ? `, liberada para ${drv(d.to).name}` : ''}. Justificativa: ${d.just}`, { vehicleId: vid, driverId: c.driverId });
      notify(c.driverId, `Sua posse do ${v.plate} foi encerrada pela gestão (${CUR.name}).`, { level: 'warn' });
      if (d.to) {
        const t = { id: uid('trf'), vehicleId: vid, fromDriverId: c.driverId, toDriverId: d.to, status: 'aguardando_recebimento', requestedAt: nowTs(), forced: true, justification: d.just, requestedBy: CUR.id, fromCustodyId: c.id, toCustodyId: null, deliverChecklistId: null, receiveChecklistId: null, events: [{ at: nowTs(), status: 'aguardando_recebimento', by: CUR.id, note: `Transferência forçada: ${d.just}` }] };
        S.transfers.push(t); c.transferId = t.id;
        notify(d.to, `A gestão liberou o ${v.plate} para você. Faça o checklist de recebimento.`, { level: 'ok', link: { page: 'inicio' } });
      }
      save(); toast('Transferência forçada registrada.'); go('veiculo', { id: vid });
    });
  }
};

const LVL_CLASS = { normal: 'neu', atencao: 'warn', urgente: 'urg', vencido: 'bad' };
function calEvents(from, to, vid) {
  const today = startOfDay(nowTs()); const ev = [];
  S.vehicles.filter(v => v.active && (!vid || v.id === vid)).forEach(v => {
    S.plans.filter(p => p.vehicleId === v.id).forEach(p => {
      const d = planDue(p); if (d.date == null) return;
      const date = Math.max(d.date, today);
      if (date >= from && date < to) ev.push({ date, kind: 'mnt', c: LVL_CLASS[d.lvl], lvl: d.lvl, label: p.item, plate: v.plate, vid: v.id, planId: p.id, d });
    });
    if (v.ownership === 'locada' && v.rental?.status === 'ativa') {
      const date = Math.max(startOfDay(v.rental.dueDate), today); const rs = rentalState(v);
      if (date >= from && date < to) ev.push({ date, kind: 'rent', c: rs.lvl === 'normal' ? 'rent' : LVL_CLASS[rs.lvl], lvl: rs.lvl, label: 'Devolver ou renovar', plate: v.plate, vid: v.id, rs });
    }
  });
  S.maintRecords.filter(r => (!vid || r.vehicleId === vid) && r.at >= from && r.at < to).forEach(r => ev.push({ date: startOfDay(r.at), kind: 'done', c: 'ok', lvl: 'ok', label: r.items.join(', '), plate: veh(r.vehicleId).plate, vid: r.vehicleId, rec: r }));
  ev.push(...docCalEvents(from, to, vid));
  return ev.sort((a, b) => a.date - b.date || (M_LEVEL[b.lvl]?.r || 0) - (M_LEVEL[a.lvl]?.r || 0));
}

/* ===================== Localização pelo celular do condutor (sem rastreador externo) =====================
   Enquanto o condutor está com um veículo e o gestaovia aberto no celular, o navegador envia a posição:
   - última posição do veículo (vehicle_last_location), a cada intervalo configurado ou ao andar ~300 m;
   - histórico do trajeto (vehicle_positions), usado para desenhar o caminho do dia;
   - alerta de excesso de velocidade (tracker_events) quando o GPS mede velocidade acima do limite.
   Limite natural da web: com a tela bloqueada ou o app fechado o navegador deixa de enviar. */
const ALARM_LABEL = { overspeed: 'Excesso de velocidade' };
const TELEMETRY_ALARMS = ['overspeed'];
const GPS_DEF = () => ({ enabled: true, intervalSec: 120, speedLimit: 100, maxAccuracy: 150 });
const gpsCfg = () => S.settings.gps || (S.settings.gps = GPS_DEF());
const distKm = (a, b) => Math.hypot(a.lat - b.lat, (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180)) * 111.2;

const GPS = {
  watch: null, last: null, prev: null, state: 'off', msg: '', lastOver: {},
  myCustody() { const d = myDriver(); return d ? driverCustodies(d.id)[0] || null : null; },
  start() {
    if (CUR?.role !== 'condutor' || !gpsCfg().enabled) return this.stop('off');
    if (!this.myCustody()) return this.stop('sem_veiculo');
    if (!navigator.geolocation) return this.stop('indisponivel');
    if (this.watch != null) return;
    this.state = 'aguardando'; this.paint();
    this.watch = navigator.geolocation.watchPosition(p => this.onPos(p), e => {
      this.state = e.code === 1 ? 'negado' : 'erro'; this.msg = e.message || ''; this.paint();
    }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 60000 });
  },
  stop(state = 'off') { if (this.watch != null) { try { navigator.geolocation.clearWatch(this.watch); } catch (e) { } } this.watch = null; this.state = state; this.paint(); },
  refresh() { if (this.myCustody() && gpsCfg().enabled && CUR?.role === 'condutor') this.start(); else this.stop(this.myCustody() ? 'off' : 'sem_veiculo'); },
  onPos(p) {
    const c = this.myCustody(); if (!c) return this.stop('sem_veiculo');
    const cfg = gpsCfg(); const { latitude: lat, longitude: lng, accuracy, speed } = p.coords; const at = p.timestamp || nowTs();
    if (accuracy && accuracy > cfg.maxAccuracy) { this.state = 'impreciso'; this.paint(); return; }
    const here = { lat, lng, at };
    // velocidade: a medida pelo GPS do aparelho; sem ela, estimada entre duas leituras
    let kmh = speed != null && !isNaN(speed) ? speed * 3.6 : null;
    if (kmh == null && this.prev && at > this.prev.at) { const h = (at - this.prev.at) / 36e5; if (h > 0) kmh = distKm(this.prev, here) / h; }
    this.prev = here; this.state = 'ativo'; this.paint();
    const v = veh(c.vehicleId); if (!v) return;
    if (kmh != null && speed != null && kmh > cfg.speedLimit && (!accuracy || accuracy <= 50)) this.overspeed(v, c, here, Math.round(kmh));
    const due = !this.last || this.last.vid !== v.id || at - this.last.at >= cfg.intervalSec * 1000 || (distKm(this.last, here) > .3 && at - this.last.at > 20000);
    if (!due) return;
    this.last = { ...here, vid: v.id };
    const spd = kmh != null ? Math.round(kmh) : null;
    S.locations[v.id] = { lat, lng, speed: spd, ignition: null, km: v.odometer, at, source: 'celular' };
    // grava primeiro a posse/posição pendentes (o banco confere se o veículo está com o condutor)
    if (CLOUD.on) CLOUD.flush().then(() => CLOUD.client().from('vehicle_positions').insert({ vehicle_id: v.id, driver_id: c.driverId, lat, lng, speed: spd, km: v.odometer, at: new Date(at).toISOString(), source: 'celular' }).then(({ error }) => { if (error) { this.msg = friendlyError(error); } }));
  },
  overspeed(v, c, here, kmh) {
    if (nowTs() - (this.lastOver[v.id] || 0) < 10 * MIN) return; // no máximo um alerta a cada 10 min por veículo
    this.lastOver[v.id] = nowTs();
    S.trackerEvents.push({ id: uid(), extId: null, vehicleId: v.id, driverId: c.driverId, type: 'overspeed', at: here.at, speed: kmh, lat: here.lat, lng: here.lng });
    log('telemetria', `Excesso de velocidade (${kmh} km/h) medido pelo GPS do celular`, { vehicleId: v.id, driverId: c.driverId, at: here.at });
    notify('gestao', `${v.plate}: excesso de velocidade a ${kmh} km/h · ${drv(c.driverId)?.name || ''}.`, { level: 'warn', link: { page: 'veiculo', id: v.id } });
    save();
  },
  paint() { const el = $('#gps-chip'); if (el) el.outerHTML = gpsChip(); }
};
function gpsChip() {
  if (CUR?.role !== 'condutor') return '';
  const m = { ativo: ['ok', 'Localização ativa'], aguardando: ['warn', 'Procurando sinal de GPS…'], impreciso: ['warn', 'GPS com pouca precisão'], negado: ['bad', 'Localização bloqueada: permita nas configurações do navegador'], erro: ['bad', 'GPS indisponível no momento'], indisponivel: ['bad', 'Este aparelho não informa localização'] }[GPS.state];
  if (!m) return '<span id="gps-chip"></span>';
  return `<span id="gps-chip" class="st small" style="white-space:normal"><span class="dot ${m[0]}"></span>${m[1]}</span>`;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CUR?.role === 'condutor') { GPS.stop(GPS.state); GPS.refresh(); } });

/* ---------- trajeto do dia (histórico gravado pelo celular) ---------- */
async function drawTodayRoute(map, vid) {
  if (!map || !window.L || !CLOUD.on) return;
  const { data } = await CLOUD.client().from('vehicle_positions').select('lat,lng,at,speed').eq('vehicle_id', vid).gte('at', new Date(startOfDay(nowTs())).toISOString()).order('at').limit(3000);
  const pts = (data || []).map(p => ({ lat: +p.lat, lng: +p.lng, at: Date.parse(p.at) }));
  if (!MAPS.includes(map) || pts.length < 2) return;
  const line = L.polyline(pts.map(p => [p.lat, p.lng]), { color: cssVar('--blue'), weight: 4, opacity: .75 }).addTo(map);
  L.circleMarker([pts[0].lat, pts[0].lng], { radius: 5, color: '#fff', weight: 2, fillColor: cssVar('--green'), fillOpacity: 1 }).bindTooltip(`Início ${fmtTime(pts[0].at)}`).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [20, 20], animate: false, maxZoom: 14 });
  const kmTot = pts.reduce((s, p, i) => i ? s + distKm(pts[i - 1], p) : 0, 0);
  const el = $('#route-info'); if (el) el.textContent = `Trajeto de hoje · ${nf(kmTot, 0)} km · ${pts.length} posições`;
}

/* ===================== Documentação do veículo: CRLV e IPVA ===================== */
const docSet = () => S.settings.docs || (S.settings.docs = { warnDays: 30, urgentDays: 7 });
const docsOf = v => v.docs || (v.docs = { crlv: [], ipva: [], ipvaByRental: v.ownership === 'locada' });
const crlvCurrent = v => docsOf(v).crlv.slice().sort((a, b) => b.year - a.year)[0] || null;
function dueLevel(due) {
  const days = Math.floor((startOfDay(due) - startOfDay(nowTs())) / DAY); const st = docSet();
  return { days, lvl: days < 0 ? 'vencido' : days <= st.urgentDays ? 'urgente' : days <= st.warnDays ? 'atencao' : 'normal' };
}
// pendências de documentação de um veículo (licenciamento e parcelas de IPVA em aberto)
function docItems(v) {
  const d = docsOf(v); const out = [];
  const c = crlvCurrent(v);
  if (!c) out.push({ kind: 'crlv', label: 'CRLV não cadastrado', due: null, days: null, lvl: 'atencao' });
  else if (c.licDue) out.push({ kind: 'lic', label: `Licenciamento ${c.year + 1}`, due: c.licDue, ...dueLevel(c.licDue), ref: c });
  if (!d.ipvaByRental) {
    d.ipva.forEach(y => y.installments.filter(i => !i.paidAt).forEach(i => out.push({ kind: 'ipva', label: `IPVA ${y.year}${y.installments.length > 1 ? ` · parcela ${i.n}/${y.installments.length}` : ' · cota única'}`, due: i.due, value: i.value, ...dueLevel(i.due), year: y, inst: i })));
    const nextY = new Date().getFullYear() + 1;
    if (new Date().getMonth() === 11 && !d.ipva.some(y => y.year === nextY)) out.push({ kind: 'ipva_new', label: `Registrar IPVA ${nextY}`, due: new Date(nextY, 0, 10).getTime(), ...dueLevel(new Date(nextY, 0, 10).getTime()) });
  }
  out.push(...insuranceItems(v));
  return out.sort((a, b) => (a.due ?? 0) - (b.due ?? 0));
}
function docAttention() {
  const out = [];
  S.vehicles.filter(v => v.active).forEach(v => docItems(v).filter(x => x.lvl !== 'normal').forEach(x => {
    const sub = x.due == null ? 'Anexe o documento do veículo' : x.days < 0 ? `Vencido há ${-x.days} dias${x.value ? ' · ' + money(x.value) : ''}` : x.days === 0 ? 'Vence hoje' : `Vence em ${x.days} dias${x.value ? ' · ' + money(x.value) : ''}`;
    out.push({ c: M_LEVEL[x.lvl].c === 'gray' ? 'warn' : M_LEVEL[x.lvl].c, r: x.lvl === 'vencido' ? 8 : x.lvl === 'urgente' ? 5 : 2, icon: 'fine', title: `${v.plate} · ${x.label}`, sub, text: '', at: null, go: { page: 'veiculo', id: v.id, tab: 'docs' } });
  }));
  return out;
}
function docCalEvents(from, to, vid) {

function readDocFile(file) {
  return new Promise(async res => {
    if (!file) return res(null);
    if (file.type.startsWith('image/')) return res({ name: file.name, size: file.size, type: file.type, data: await readPhoto(file, 1400) });
    if (file.size <= 9.5 * 1024 * 1024) { const fr = new FileReader(); fr.onload = () => res({ name: file.name, size: file.size, type: file.type, data: fr.result }); fr.onerror = () => res({ name: file.name, size: file.size, type: file.type, data: null }); return fr.readAsDataURL(file); }
    res({ name: file.name, size: file.size, type: file.type, data: null, tooBig: true });
  });
}

function imgToJpeg(src, maxW = 1000) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.onload = () => {
      const w0 = im.naturalWidth || 480, h0 = im.naturalHeight || 360; const sc = Math.min(1, maxW / w0);
      const c = document.createElement('canvas'); c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      try { res({ data: c.toDataURL('image/jpeg', .85), w: c.width, h: c.height }); } catch (e) { res(null); }
    };
    im.onerror = () => res(null); if (/^https?:/.test(src)) im.crossOrigin = 'anonymous'; im.src = src;
  });
}
async function offerFile(filename, blob) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); toast('PDF gerado.');
}
async function checklistPDF(id) {

  y = 36;

  text(k.ok ? 'Sem apontamentos' : k.problem ? 'Veículo com problema informado' : 'Com apontamentos', M + 4, y + 1.5, { bold: true, color: okC });
  text(`${fmtDT(k.at)}${k.late ? ' · fora do prazo' : ''}`, W - M - 4, y + 1.5, { color: MUTED, align: 'right' });

  sp.tsSet = new Set(sp.ts || []);
});
function toRow(sp, o) {
  if (sp.single) { const data = JSON.parse(JSON.stringify(o)); return { id: 1, data }; }
  const row = {}; const extra = {};
  for (const [k, v] of Object.entries(o)) {
    if (k.startsWith('_') || v === undefined) continue;
    const c = sp.colOf[k];
    if (c) row[c] = sp.tsSet.has(k) ? (v == null || v === '' || isNaN(v) ? null : new Date(v).toISOString()) : (typeof v === 'number' && !isFinite(v) ? null : v);
    else extra[k] = v;
  }
  row.extra = extra;
  return row;
}
function fromRow(sp, r) {
  if (sp.single) return r.data || {};
  const o = { ...(r.extra || {}) };
  for (const [c, v] of Object.entries(r)) {
    const k = sp.keyOf[c]; if (!k) continue;
    o[k] = sp.tsSet.has(k) ? (v == null ? null : Date.parse(v)) : v;
  }
  return o;
}
const listOf = sp => sp.single ? [S.settings] : sp.asMap ? Object.entries(S.locations || {}).map(([id, l]) => ({ ...l, id })) : (S[sp.key] || []);

  supervisor: new Set(['audit', 'notifications', 'locations']),

const DEFAULT_SETTINGS = () => ({

function fillDefaults(dst, def) { for (const [k, v] of Object.entries(def)) { if (dst[k] === undefined || dst[k] === null) dst[k] = v; else if (v && typeof v === 'object' && !Array.isArray(v) && typeof dst[k] === 'object') fillDefaults(dst[k], v); } return dst; }

const CLOUD = {
  on: false, sb: null, profile: null, base: {}, busy: null, again: false, timer: null, poll: null,
  signed: {}, status: 'ok', lastError: '', retryT: null,

  client() {
    if (!this.sb) this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'vialink-auth' } });
    return this.sb;
  },
  async reachable() {
    try { const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/auth/v1/health', { headers: { apikey: CFG.supabaseKey }, cache: 'no-store' }); return r.ok; }
    catch (e) { return false; }
  },

  /* ---------- sessão ---------- */
  async boot() {
    if (!window.supabase?.createClient) { ROUTE = { page: 'login', p: {} }; render(); LOGIN_MSG = 'Não foi possível carregar a biblioteca do Supabase. Verifique a conexão.'; return render(); }
    const sb = this.client();
    sb.auth.onAuthStateChange((ev) => {
      if (ev === 'PASSWORD_RECOVERY') { RECOVERY = true; if (this.on) go('senha'); }
      if (ev === 'SIGNED_OUT' && this.on) this.leave('Sua sessão terminou. Entre novamente.');
    });
    // ao recarregar a página mostra só a marca até saber se já existe sessão (não pisca a tela de entrada)
    ROUTE = { page: 'login', p: {} }; BOOTING = true; render();
    let session = null; try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) { }
    if (session?.user) await this.enter(session.user);
    BOOTING = false; if (!this.on) render();
  },
  async enter(user) {
    const sb = this.client();
    LOGIN_BUSY = true; render();
    try {
      const { data: prof, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (error) throw error;
      if (!prof || !prof.active) { await sb.auth.signOut(); LOGIN_BUSY = false; BOOTING = false; LOGIN_MSG = 'Seu acesso ainda não foi liberado ou está inativo. Procure o administrador da frota.'; return render(); }
      this.profile = prof;
      await this.loadAll();
      CUR = S.users.find(u => u.id === prof.id);
      this.on = true; LOGIN_BUSY = false; BOOTING = false; LOGIN_MSG = '';
      this.startPolling();
      let back = null; try { back = JSON.parse(sessionStorage.getItem('gv-route') || 'null'); } catch (e) { }
      if (prof.must_change_password || RECOVERY) go('senha');
      else if (back?.page && PAGES[back.page] && back.page !== 'login' && back.page !== 'senha') go(back.page, back.p || {}, { noPush: true });
      else go(homePage());
      try { autoCloseCheck(); } catch (e) { }
      if (CUR.role === 'condutor') GPS.refresh();
    } catch (e) {
      LOGIN_BUSY = false; BOOTING = false; LOGIN_MSG = 'Não foi possível carregar os dados: ' + friendlyError(e); render();
    }
  },
  async leave(msg) {
    this.on = false; clearInterval(this.poll); clearTimeout(this.timer); clearTimeout(this.retryT); GPS.stop();
    this.base = {}; this.signed = {}; CUR = null; S = null; LOGIN_MSG = msg || '';
    try { sessionStorage.removeItem('gv-route'); } catch (e) { }
    try { await this.client().auth.signOut(); } catch (e) { }
    ROUTE = { page: 'login', p: {} }; render();
  },

  /* ---------- leitura (o banco devolve só o que o perfil pode ver) ---------- */
  async fetchAll(sp) {
    const sb = this.client(); const out = [];
    // condutor: lista de veículos só com identificação (sem locação, documentos e custos)
    if (sp.key === 'vehicles' && this.profile?.role === 'condutor') {
      const [{ data, error }, em] = await Promise.all([sb.rpc('vehicle_directory'), sb.rpc('vehicle_emergency')]); if (error) throw error;
      const ins = new Map((em.data || []).map(r => [r.id, r.insurance])); return (data || []).map(r => ({ ...r, insurance: ins.get(r.id) || null }));
    } const step = 1000; const cap = sp.limit || 50000;
    for (let from = 0; from < cap; from += step) {
      let q = sb.from(sp.table).select('*');
      q = sp.limit ? q.order('at', { ascending: false }) : q.order('id');
      const { data, error } = await q.range(from, from + step - 1);
      if (error) throw error;
      out.push(...data); if (data.length < step) break;
    }
    return out;
  },
  async loadAll() {
    const sb = this.client();
    const [lists, prof, dir] = await Promise.all([
      Promise.all(SPEC.map(sp => this.fetchAll(sp))),
      sb.from('profiles').select('id,name,email,role,driver_id,active,must_change_password,is_owner,avatar').order('name'),
      sb.rpc('driver_directory')
    ]);
    if (prof.error) throw prof.error;
    const D = { version: 6, cloud: true, locations: {}, users: [] };
    SPEC.forEach((sp, i) => {
      const rows = lists[i];
      if (sp.single) { D.settings = fillDefaults(rows[0] ? fromRow(sp, rows[0]) : {}, DEFAULT_SETTINGS()); delete D.settings.traccar; delete D.settings.tracker; return; }
      const objs = rows.map(r => fromRow(sp, r));
      if (sp.sort) objs.sort((a, b) => (a[sp.sort] || 0) - (b[sp.sort] || 0));
      if (sp.asMap) objs.forEach(o => { const { id, ...l } = o; D.locations[id] = l; }); else D[sp.key] = objs;
    });
    D.users = (prof.data || []).map(p => ({ id: p.id, name: p.name, email: p.email, role: p.role, driverId: p.driver_id, active: p.active, mustChange: p.must_change_password, owner: !!p.is_owner, avatar: p.avatar || null }));
    // condutor: nomes dos colegas sem dados pessoais (CNH, telefone)
    (dir.data || []).forEach(d => { if (!D.drivers.some(x => x.id === d.id)) D.drivers.push({ id: d.id, name: d.name, active: d.active, _ro: true }); });
    S = D;
    // inicializações preguiçosas do aplicativo feitas antes da foto de referência
    S.vehicles.forEach(v => docsOf(v)); docSet();
    this.snapshot();
    await this.signAll();
  },
  snapshot() {
    this.base = {};
    SPEC.forEach(sp => { const m = new Map(); listOf(sp).forEach(o => { if (o && !o._ro) m.set(String(o.id ?? 1), clone(toRow(sp, o))); }); this.base[sp.key] = m; });
  },

  /* ---------- gravação: só as colunas que mudaram, numa transação ---------- */
  diff() {
    const ops = [];
    for (const sp of SPEC) {
      const base = this.base[sp.key] || new Map(); const seen = new Set();
      for (const o of listOf(sp)) {
        if (!o || o._ro) continue;
        const id = String(o.id ?? 1); seen.add(id);
        const row = toRow(sp, o); const old = base.get(id);
        if (!old) { ops.push({ sp, op: sp.upsert ? 'upsert' : 'insert', id, row }); continue; }
        const ch = { id: row.id }; let n = 0;
        for (const c of new Set([...Object.keys(row), ...Object.keys(old)])) {
          if (c === 'id') continue;
          if (stable(row[c] ?? null) !== stable(old[c] ?? null)) { ch[c] = row[c] ?? null; n++; }
        }
        if (n) ops.push({ sp, op: sp.upsert ? 'upsert' : 'update', id, row: sp.upsert ? row : ch, full: row });
      }
      if (!sp.single) for (const id of base.keys()) if (!seen.has(id)) ops.push({ sp, op: 'delete', id });
    }
    return ops;
  },
  allowed(op) {
    const w = WRITES[CUR?.role]; if (w === null) return true; if (!w || !w.has(op.sp.key)) return false;
    if (CUR.role === 'condutor') {
      if (op.op === 'delete') return false;
      if (op.sp.key === 'vehicles') { if (op.op !== 'update' || op.row.odometer === undefined) return false; op.row = { id: op.row.id, odometer: op.row.odometer }; }
      if (op.sp.key === 'issues' && op.op !== 'insert') return false;
      if (op.sp.key === 'notifications' && op.op === 'update') { if (Object.keys(op.row).some(k => k !== 'id' && k !== 'read')) return false; }
    }
    if (CUR.role === 'supervisor' && op.sp.key === 'notifications' && op.op === 'update' && Object.keys(op.row).some(k => k !== 'id' && k !== 'read')) return false;
    return true;
  },
  rebase(ops) {
    ops.forEach(o => {
      const m = this.base[o.sp.key];
      if (o.op === 'delete') m.delete(o.id);
      else if (o.op === 'update') m.set(o.id, { ...(m.get(o.id) || {}), ...clone(o.full || o.row) });
      else m.set(o.id, clone(o.full || o.row));
    });
  },
  queue() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 350); },
  async flush() {
    if (!this.on) return;
    if (this.busy) { this.again = true; return this.busy; }
    this.busy = (async () => {
      let ops = [];
      try {
        await this.externalize();
        ops = this.diff();
        // inclusões primeiro (ordem das tabelas), depois alterações, por último exclusões:
        // assim a posse nova já existe quando o hodômetro do veículo é atualizado pelo condutor.
        // Exceção: QR Code revogado sai antes do novo entrar (o banco aceita só um ativo por veículo).
        const rank = o => o.op === 'delete' ? 2 : o.sp.key === 'qrcodes' && o.op === 'update' ? -1 : o.op === 'update' ? 1 : 0;
        const send = ops.filter(o => this.allowed(o)).map((o, i) => [o, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || (rank(a[0]) === 2 ? b[1] - a[1] : a[1] - b[1])).map(x => x[0]);
        if (send.length) {
          this.setStatus('saving');
          for (let i = 0; i < send.length; i += 300) {
            const chunk = send.slice(i, i + 300).map(o => o.op === 'delete' ? { t: o.sp.table, op: 'delete', id: o.id } : { t: o.sp.table, op: o.op, row: o.row });
            const { error } = await this.client().rpc('sync_apply', { ops: chunk });
            if (error) throw error;
          }
        }
        this.rebase(ops);
        this.setStatus('ok');
      } catch (e) {
        await this.onSyncError(e);
      } finally {
        this.busy = null;
        if (this.again) { this.again = false; this.flush(); }
      }
    })();
    return this.busy;
  },
  async onSyncError(e) {
    const offline = e instanceof TypeError || /fetch|network|Failed/i.test(e?.message || '') && !e?.code;
    if (offline) {
      this.setStatus('offline'); toast('Sem conexão com o servidor. Suas alterações serão enviadas quando a conexão voltar.');
      clearTimeout(this.retryT); this.retryT = setTimeout(() => this.flush(), 15000); return;
    }
    this.setStatus('error'); this.lastError = friendlyError(e);
    toast('Não foi possível salvar: ' + this.lastError + ' Os dados foram recarregados.');
    // recarrega depois que esta gravação terminar (dentro dela, reload esperaria por si mesma)
    setTimeout(() => this.reload(true, true).then(() => this.setStatus('ok')).catch(() => { }), 0);
  },
  setStatus(s) { this.status = s; const b = $('#sync-badge'); if (b) b.outerHTML = syncBadge(); },

  /* ---------- atualização periódica (o que outros usuários registraram) ---------- */
  startPolling() {
    clearInterval(this.poll);
    this.poll = setInterval(() => this.reload(false), 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.reload(false); });
  },
  async reload(force, skipFlush) {
    if (!this.on) return;
    if (force && !skipFlush) { clearTimeout(this.timer); await this.flush(); }
    if (this.busy) { if (!force) return; await this.busy; }
    if (!force && (DRAFT || FORM_DIRTY || $('#modal') || this.diff().some(o => this.allowed(o)))) return;
    const before = stable([...Object.values(this.base)].map(m => [...m.entries()]));
    const keepCur = CUR?.id;
    await this.loadAll();
    CUR = S.users.find(u => u.id === keepCur) || CUR;
    if (!CUR?.active) return this.leave('Seu acesso foi desativado.');
    const after = stable([...Object.values(this.base)].map(m => [...m.entries()]));
    if (force || before !== after) render();
  },

  /* ---------- arquivos: fotos e documentos vão para o Storage privado ---------- */
  async externalize() {
    const jobs = [];
    const walk = (obj, table, id) => {
      if (!obj || typeof obj !== 'object') return;
      for (const [k, v] of Object.entries(obj)) {
        if (typeof v === 'string' && v.startsWith('data:') && v.length > 200) jobs.push({ obj, k, v, table, id });
        else if (v && typeof v === 'object') walk(v, table, id);
      }
    };
    SPEC.forEach(sp => { if (!sp.single && !sp.asMap) listOf(sp).forEach(o => { if (!o._ro) walk(o, sp.table, o.id); }); });
    for (const j of jobs) {
      const m = /^data:([^;,]+)[;,]/.exec(j.v); const type = m ? m[1] : 'application/octet-stream';
      const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'application/pdf': 'pdf' }[type] || 'bin';
      const bin = atob(j.v.slice(j.v.indexOf(',') + 1)); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const path = `${j.table}/${j.id}/${crypto.randomUUID()}.${ext}`;
      const { error } = await this.client().storage.from(BUCKET).upload(path, new Blob([bytes], { type }), { contentType: type, upsert: false });
      if (error) throw error;
      this.signed[path] = { url: j.v, at: Date.now() + 864e5 * 365 }; // mostra a cópia local até a próxima leitura
      j.obj[j.k] = 'sb:' + path;
    }
  },
  pathsIn() {
    const out = new Set();
    const walk = o => { if (!o || typeof o !== 'object') return; for (const v of Object.values(o)) { if (typeof v === 'string' && v.startsWith('sb:')) out.add(v.slice(3)); else if (v && typeof v === 'object') walk(v); } };
    ['checklists', 'issues', 'fuel', 'vehicles', 'fines'].forEach(k => (S[k] || []).forEach(walk));
    return [...out];
  },
  async signAll() {
    const need = this.pathsIn().filter(p => !this.signed[p] || this.signed[p].at < Date.now() + 5 * 60000);
    for (let i = 0; i < need.length; i += 100) {
      const { data } = await this.client().storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 3600);
      (data || []).forEach(d => { if (d.signedUrl) this.signed[d.path] = { url: d.signedUrl, at: Date.now() + 3500e3 }; });
    }
  },
  fileUrl(ref) { const p = String(ref).slice(3); return this.signed[p]?.url || null; },

  /* ---------- funções do servidor ---------- */
  async fn(name, body) {
    const { data, error } = await this.client().functions.invoke(name, { body });
    if (error) {
      let msg = error.message;
      try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch (e) { }
      throw new Error(msg);
    }
    if (data?.error) throw new Error(data.error);
    return data;
  },
  async rpc(name, args) { const { data, error } = await this.client().rpc(name, args || {}); if (error) throw error; return data; }
};

function friendlyError(e) {
  const m = String(e?.message || e || '');
  if (/custody_no_overlap/.test(m)) return 'o veículo já está com outro condutor.';
  if (/row-level security|Sem permissão|42501/.test(m) || e?.code === '42501') return 'seu perfil não tem permissão para esta ação.';
  if (/inativo/.test(m)) return 'seu acesso está inativo.';
  if (/JWT|expired|sess/i.test(m)) return 'sua sessão expirou. Entre novamente.';
  if (/duplicate key|unique/.test(m)) return 'já existe um registro igual (placa, código ou número repetido).';
  if (/violates check constraint/.test(m)) return 'algum valor está fora do permitido.';
  return m.replace(/^Error:\s*/, '');
}

  if (APP_MODE !== 'cloud') return '';

}

/* ---------- imagens pequenas (foto de perfil e logo) ---------- */
function squareImage(file, size = 256, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Escolha uma imagem (JPG ou PNG).'));
    const fr = new FileReader(); fr.onerror = () => rej(new Error('Não foi possível ler a imagem.'));
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); const x = c.getContext('2d');
        if (type === 'image/png') { // logo: mantém proporção e transparência
          const sc = Math.min(1, size / Math.max(im.width, im.height)); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          x.drawImage(im, 0, 0, c.width, c.height); return res(c.toDataURL('image/png'));
        }
        const s = Math.min(im.width, im.height); c.width = c.height = size; // foto: recorte quadrado no centro
        x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, size, size);
        res(c.toDataURL('image/jpeg', .82));
      };

/* ---------- km por obra: tempo de cada trecho de obra dentro da posse ---------- */
function kmByProject(from, to) {

    const end = c.end || nowTs(); const endKm = c.endKm ?? veh(c.vehicleId)?.odometer ?? c.startKm; if (end <= c.start) return;

    const segs = c.segments.length ? c.segments : [{ at: c.start, projectId: null }];
    segs.forEach((s, i) => {
      const a = Math.max(i ? s.at : c.start, from), b = Math.min(segs[i + 1]?.at ?? end, end, to);
      if (b > a) out[s.projectId || '_'] = (out[s.projectId || '_'] || 0) + kmPerMs * (b - a);
    });
  });
  return out;
}
function rentalInMonth(v, from, to) {
  const r = v.rental; if (v.ownership !== 'locada' || !r?.monthly) return 0;
  const a = Math.max(from, r.pickupDate || from), b = Math.min(to, r.returnedAt || to);

    const dl = d + hm(P.deadline) * MIN;
    if (vehs.length && vehs.every(v => blockedAt(v, dl))) { exempt++; return; } // veículo parado por problema crítico
    const dk = cks.filter(k => tsOf(k) >= d && tsOf(k) < nextDay(d));
    if (dk.some(k => k.type !== 'diario') || dk.some(k => tsOf(k) <= dl)) { onTime++; return; }
    const lk = dk.find(k => k.type === 'diario');
    if (lk) { late++; add({ key: `B:${dayKey(d)}`, mod: 'B', at: tsOf(lk), pts: P.discLate, why: `Checklist diário enviado às ${fmtTime(tsOf(lk))}, depois do prazo (${P.deadline})`, ev: { checklistId: lk.id, vehicleId: lk.vehicleId } }); return; }
    if (now < nextDay(d)) { pending++; return; } // hoje: ainda dá tempo até 23h59 (sem desconto por enquanto)
    absent++; add({ key: `B:${dayKey(d)}`, mod: 'B', at: d, pts: P.discAbsent, why: 'Nenhum checklist diário enviado no dia', ev: { vehicleId: vehs[0] || null } });
  });

  // C · abastecimento com foto do hodômetro (−10 por abastecimento sem foto)
  fuels.forEach(f => { if (!fuelHasOdo(f)) add({ key: `C:foto:${f.id}`, mod: 'C', at: f.at, pts: P.discC, why: `Abastecimento sem foto do hodômetro (${nf(f.liters, 1)} L em ${f.station || 'posto não informado'})`, ev: { fuelId: f.id, vehicleId: f.vehicleId } }); });

  // ocorrências registradas pela gestão (ex.: abastecimento sem registro no extrato do cartão, uso sem checklist)
  live.filter(a => a.kind === 'ocorrencia' && MODS[a.modality]).forEach(a => add({ key: `M:${a.id}`, mod: a.modality, at: a.at || a.createdAt, pts: Math.abs(+a.points || 0), why: a.reason, manual: a.id, ev: { vehicleId: a.vehicleId || null } }));
  occ.sort((a, b) => (a.at || 0) - (b.at || 0));

  // cálculo (item 6)
  const mods = Object.fromEntries(Object.entries(MODS).map(([k, m]) => {
    const max = +P[m.pk] || 0; const disc = sum(occ.filter(o => o.mod === k && !o.abono), o => o.pts);
    return [k, { k, l: m.l, max, disc, v: Math.max(0, max - disc), zero: max > 0 && disc >= max, n: occ.filter(o => o.mod === k && !o.abono).length }];
  }));
  const subtotal = sum(Object.values(mods), m => m.v);
  const zeroed = Object.values(mods).filter(m => m.zero).length; const penalty = zeroed * (+P.zeroPenalty || 0);
  const adjust = sum(live.filter(a => a.kind === 'ajuste'), a => +a.points || 0);
  const total = Math.max(0, Math.min(100, subtotal - penalty + adjust));
  // premiação (item 7)
  const eligible = cs.length > 0;
  const base = (+P.baseValue || 0) * total / 100;
  let addv = total >= 100 ? +P.add100 || 0 : total >= 90 ? +P.add90 || 0 : 0; const addBlocked = addv > 0 && possDays.length < (+P.addMinDays || 0);
  if (addBlocked) addv = 0;
  const full = base + addv; const factor = biz.length ? possDays.length / biz.length : 0;
  const bonus = eligible ? Math.round(full * factor * 100) / 100 : 0;
  const parts = Object.values(mods).map(m => ({ k: m.k, l: m.l, v: m.v, max: m.max, info: m.n ? `${m.n} desconto(s)${m.zero ? ' · zerada' : ''}` : 'Sem descontos' }));
  return { key, from, to, partial, P, total, bonus, eligible, mods, subtotal, zeroed, penalty, adjust, base, add: addv, addBlocked, full, factor, possDays: possDays.length, bizDays: biz.length,
    occurrences: occ, adjustments: adjs, parts, req: onTime + late + absent, done: onTime + late, late, absent, pending, exempt, tier: null, fines: [] };
}
function rankList(key) {
  const [from, to] = periodRange(key);
  const list = S.drivers.filter(d => !d._ro || d.id === CUR?.driverId).filter(d => d.active !== false || S.custody.some(c => c.driverId === d.id && c.start < to && (!c.end || c.end > from)))
    .map(d => ({ d, sc: driverScore(d.id, key) })).sort((a, b) => (b.sc.eligible - a.sc.eligible) || b.sc.total - a.sc.total || b.sc.bonus - a.sc.bonus || a.d.name.localeCompare(b.d.name, 'pt-BR'));
  let pos = 0; list.forEach((x, i) => { if (!i || x.sc.total !== list[i - 1].sc.total || x.sc.eligible !== list[i - 1].sc.eligible) pos = i + 1; x.pos = x.sc.eligible ? pos : null; }); // empate: mesma posição
  return list;
}

/* ----- fechamento (guarda o extrato de cada condutor como estava) ----- */
function statementRow(d, sc) {
  return { driverId: d.id, name: d.name, score: sc.total, bonus: sc.bonus, base: Math.round(sc.base * 100) / 100, add: sc.add, addBlocked: sc.addBlocked, full: Math.round(sc.full * 100) / 100, factor: sc.factor, possDays: sc.possDays, bizDays: sc.bizDays,
    subtotal: sc.subtotal, zeroed: sc.zeroed, penalty: sc.penalty, adjust: sc.adjust, mods: sc.mods, occurrences: sc.occurrences.map(o => ({ key: o.key, mod: o.mod, at: o.at, pts: o.pts, why: o.why, manual: o.manual || null, abono: o.abono, ev: o.ev })),
    adjustments: sc.adjustments.filter(a => a.kind === 'ajuste' && !a.voidedAt).map(a => ({ points: a.points, reason: a.reason, at: a.createdAt })), counts: { late: sc.late, absent: sc.absent, exempt: sc.exempt }, P: sc.P };
}
function buildClosing(key, auto) {
  const list = rankList(key).filter(x => x.sc.eligible);
  const rows = list.map(({ d, sc, pos }) => ({ pos, ...statementRow(d, sc) }));
  const [from, to] = periodRange(key);
  return { id: uid(), month: key, closedAt: nowTs(), closedBy: CUR.id, auto: !!auto, rows, total: Math.round(sum(rows, r => r.bonus) * 100) / 100, from, to, releaseAt: releaseAt(key) };
}
function closeMonth(key, auto) {
  if (closingOf(key)) return null;
  const c = buildClosing(key, auto); if (auto && !c.rows.length) return null;
  S.closings = S.closings || []; S.closings.push(c);
  log('premiacao', `Fechamento da premiação do período ${periodDates(key)} ${auto ? 'feito automaticamente' : `feito por ${CUR.name}`}: ${c.rows.filter(r => r.bonus).length} premiado(s), ${money(c.total)}. Extrato liberado aos condutores em ${fmtDate(c.releaseAt)}.`, {});
  notify('gestao', `Premiação do período ${periodDates(key)} fechada${auto ? ' automaticamente' : ''}: ${money(c.total)}.`, { level: 'ok', link: { page: 'relatorios', id: '' } });
  c.rows.forEach(r => notify(r.driverId, `Seu extrato da premiação (${periodDates(key)}) fica disponível em ${fmtDate(c.releaseAt)}.`, { link: { page: 'inicio' } }));
  return c;
}
// fechamento automático: na data de divulgação do período anterior (fim do período + dias de divulgação)
function autoCloseCheck() {
  if (!isManager()) return;
  const b = bonusCfg(); if (!b.closing.auto) return;
  const prev = shiftMonth(curPeriod(), -1);
  if (b.startPeriod && prev < b.startPeriod) return;
  if (closingOf(prev) || nowTs() < releaseAt(prev)) return;
  if (closeMonth(prev, true)) { save(); toast(`Premiação do período ${periodDates(prev)} fechada automaticamente.`); }
}

/* extrato do período (item 9): descontos, cálculo da pontuação (item 6) e da premiação (item 7) */

      return `<div class="stack">${tabs}<div class="page-head" style="margin:0">${nav}${M && !c ? `<button class="btn pri" data-act="bn-occ-new" data-p="${key}">${ic('plus')}Registrar ocorrência</button>` : ''}</div>
        <div class="note">${ic('alert')}<div>Os descontos de entrega/recebimento, checklist diário e foto do hodômetro são identificados automaticamente pelos registros. Abastecimento <b>sem registro</b> no aplicativo é lançado pela gestão a partir do extrato do cartão combustível. Abonos exigem justificativa e o original fica visível.</div></div>
        <div class="panel">${tbl(['Condutor', 'Data', 'Mod.', 'Motivo e evidência', '>Pontos', ...(M ? [''] : [])], all.sort((a, b) => b.o.at - a.o.at).map(({ d, o }) => occRow(o, { manage: M, did: d.id, key, closed: !!c, who: d })), 'Nenhum desconto neste período.')}</div></div>`;

    const totalPrev = sum(el, x => x.sc.bonus);
    return `<div class="stack">${tabs}<div class="page-head" style="margin:0">${nav}<button class="btn" data-go="relatorios" data-tab="premiacao">${ic('report')}Fechamento para o RH</button></div>
      <div class="kpis">${kpi('Média da equipe', el.length ? nf(sum(el, x => x.sc.total) / el.length, 0) : '—', 'gauge', 'c-blue', '', 'pontos')}${kpi('Com posse no período', `${el.length}`, 'user')}${kpi(cur ? 'Prêmios previstos' : 'Prêmios do período', money(totalPrev), 'star', 'c-green')}${kpi('Dias úteis', el[0]?.sc.bizDays ?? daysBetween(...periodRange(key)).filter(isBizDay).length, 'cal', '', '', cur ? 'no período' : '')}</div>
      ${el.length ? `<div class="grid3">${el.slice(0, 3).map(({ d, sc, pos }, i) => `<div class="vcard" data-go="condutor" data-id="${d.id}" data-tab="score" style="align-items:center;text-align:center;border-top:4px solid ${medal[Math.min(2, pos - 1)]}"><span class="pill ${pos === 1 ? 'ok' : ''}">${pos}º lugar</span>${av(d, 'lg')}<b>${esc(d.name)}</b>${ring(sc.total)}<b style="font-size:1.15rem;color:${sc.bonus ? 'var(--text)' : 'var(--text3)'}">${money(sc.bonus)}</b><span class="tiny muted">${sc.possDays}/${sc.bizDays} dias com posse</span></div>`).join('')}</div>` : ''}
      <div class="panel"><div class="panel-h"><h2>Condutores</h2><span class="small muted">A · B · C = entrega/recebimento · checklist diário · abastecimento</span></div>
        <div class="vlist">${list.map(({ d, sc, pos }) => `<div class="vrow" data-go="condutor" data-id="${d.id}" data-tab="score" style="grid-template-columns:30px auto 1fr auto auto"><b class="muted num">${pos ? pos + 'º' : '—'}</b>${sc.eligible ? ring(sc.total, true) : '<span class="avatar" style="background:var(--border2);color:var(--text3)">—</span>'}<div class="who2"><b>${esc(d.name)}</b>${sc.eligible ? `<div class="row" style="gap:3px;flex-wrap:nowrap;margin-top:5px">${Object.values(sc.mods).map(m => `<div class="bar s-${pctTone(m.v, m.max)}" style="flex:${m.max || 1};min-width:14px" title="${esc(m.l)}: ${nf(m.v)}/${m.max}"><i style="width:${m.max ? m.v / m.max * 100 : 0}%"></i></div>`).join('')}</div>` : '<small>Sem posse no período</small>'}</div><span class="small muted nowrap">${sc.possDays}/${sc.bizDays} dias</span><b class="num" style="min-width:86px;text-align:right;color:${sc.bonus ? 'var(--text)' : 'var(--text3)'}">${money(sc.bonus)}</b></div>`).join('') || '<div class="panel-b muted">Nenhum condutor ativo.</div>'}</div></div>
    </div>`;
  },
  mount({ tab }) { if (tab === 'parametros') mountParams(); }
};
ACTIONS['bn-p'] = a => { BON_P = shiftMonth(BON_P || curPeriod(), +a.dataset.d); if (BON_P > curPeriod()) BON_P = curPeriod(); render(); };

/* ----- parâmetros (item 11), com vigência e histórico ----- */
function paramsView(M) {
  const b = bonusCfg(); const cur = curPeriod(); const next = shiftMonth(cur, 1); const P = bonusP(cur); const Pn = bonusP(next); const dis = M ? '' : 'disabled';
  const changed = Object.keys(BONUS_DEF()).some(k => String(P[k]) !== String(Pn[k]));
  const field = k => { const [l, u] = PARAM_LABEL[k]; return `<label class="field"><span>${l}</span><div class="row" style="flex-wrap:nowrap;gap:6px">${u === 'R$' ? '<span class="small muted">R$</span>' : ''}<input class="inp num" name="${k}" value="${esc(Pn[k])}" ${k === 'deadline' ? 'type="time"' : 'inputmode="decimal"'} style="max-width:120px" ${dis}>${u && u !== 'R$' ? `<span class="small muted">${u}</span>` : ''}</div></label>`; };
  const yr = new Date().getFullYear();
  const hol = [...holidaysOf(yr), ...holidaysOf(yr + 1)].filter(h => h.date >= dayKey(nowTs() - 31 * DAY));
  return `<div class="panel"><div class="panel-h"><h2>Vigente no período atual</h2><span class="small muted">${periodName(cur)}</span></div>
      ${tbl(['Parâmetro', '>Valor'], Object.keys(PARAM_LABEL).map(k => `<tr><td>${PARAM_LABEL[k][0]}</td><td class="r num">${PARAM_LABEL[k][1] === 'R$' ? money(P[k]) : esc(P[k]) + (PARAM_LABEL[k][1] ? ' ' + PARAM_LABEL[k][1] : '')}</td></tr>`))}
      <div class="panel-b small muted">Premiação = (valor base × pontuação ÷ 100 + adicional) × dias com posse ÷ dias úteis. Adicional só para quem teve posse em ${P.addMinDays} dias ou mais.</div></div>
    <form class="panel" id="bp-form"><div class="panel-h"><h2>Alterar parâmetros</h2><span class="pill ${changed ? 'warn' : ''}">vale a partir de ${periodName(next)}</span></div>
      <div class="panel-b form-grid three">${Object.keys(PARAM_LABEL).map(field).join('')}</div>
      <div class="panel-b"><p class="small muted">Pelo regulamento, qualquer alteração só vale a partir do período seguinte à divulgação e fica registrada com data e responsável.</p><p class="err" id="bp-err"></p>${M ? '<button class="btn ok">Salvar para o próximo período</button>' : '<p class="muted small">Somente o gestor de frota ou o administrador altera os parâmetros.</p>'}</div></form>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>Feriados (dias que não são úteis)</h3></div><div class="panel-b stack" style="gap:8px">
        <div class="small muted">Feriados nacionais entram automaticamente. Inclua os municipais e estaduais das obras.</div>
        <div class="vlist">${hol.map(h => `<div class="row small" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border2)"><span><b class="num">${fmtDate(parseDate(h.date))}</b> · ${esc(h.name)}</span>${h.national ? '<span class="muted tiny">nacional</span>' : M ? `<button class="btn sm danger" data-act="hol-del" data-d="${h.date}">Remover</button>` : ''}</div>`).join('')}</div>
        ${M ? `<div class="row"><input class="inp" type="date" id="hol-d" style="max-width:170px"><input class="inp" id="hol-n" placeholder="Nome do feriado" style="flex:1;min-width:140px"><button class="btn" data-act="hol-add">${ic('plus')}Incluir</button></div>` : ''}</div></div>
      <div class="panel"><div class="panel-h"><h3>Fechamento e divulgação</h3></div><div class="panel-b stack" style="gap:10px">
        <label class="row small" style="gap:8px"><span class="toggle"><input type="checkbox" id="cl-auto" ${b.closing.auto ? 'checked' : ''} ${dis}><i></i></span>Fechamento automático na data de divulgação</label>
        <div class="small muted">O período termina no dia ${P.startDay > 1 ? P.startDay - 1 : 'último'}; o extrato é fechado e liberado aos condutores ${P.releaseDays} dia(s) depois (próxima: ${fmtDate(releaseAt(cur))}). A gestão pode fechar antes em Relatórios › Fechamento da premiação; o condutor só vê o extrato na data de divulgação.</div>
        <div class="tiny muted">Programa iniciado no período ${b.startPeriod ? periodName(b.startPeriod) : '—'}. Foto do hodômetro exigida nos abastecimentos desde ${b.odoSince ? fmtDT(b.odoSince) : '—'}.</div></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Histórico de versões</h3></div>${tbl(['Vale a partir de', 'Registrada em', 'Por', 'Alterações'], b.versions.slice().sort((x, y) => x.from < y.from ? 1 : -1).map((v, i, arr) => { const prev = arr[i + 1]; const diff = prev ? Object.keys(PARAM_LABEL).filter(k => String(v.p[k]) !== String(prev.p[k])).map(k => `${PARAM_LABEL[k][0]}: ${esc(prev.p[k])} → ${esc(v.p[k])}`).join('<br>') : 'Versão inicial (regulamento versão 00)'; return `<tr><td class="nowrap">${periodName(v.from)}</td><td class="nowrap small">${fmtDT(v.at)}</td><td class="small">${esc(userName(v.by))}</td><td class="small">${diff || '—'}</td></tr>`; }))}</div>`;
}
function mountParams() {
  $('#cl-auto')?.addEventListener('change', e => { if (!isManager()) return; bonusCfg().closing.auto = e.target.checked; log('config', `Fechamento automático da premiação ${e.target.checked ? 'ligado' : 'desligado'} por ${CUR.name}`, {}); save(); toast('Configuração salva.'); });
  const f = $('#bp-form'); if (!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault(); if (!isManager()) return; const d = formData(f); const err = t => $('#bp-err').textContent = t;
    const next = shiftMonth(curPeriod(), 1); const p = {};
    for (const k of Object.keys(PARAM_LABEL)) {
      if (k === 'deadline') { if (!/^\d{2}:\d{2}$/.test(d.deadline)) return err('Horário limite inválido.'); p.deadline = d.deadline; continue; }
      const n = parseFloat(String(d[k]).replace(/\./g, '').replace(',', '.')); if (isNaN(n) || n < 0) return err(`${PARAM_LABEL[k][0]}: valor inválido.`); p[k] = n;
    }
    if (p.startDay < 1 || p.startDay > 28) return err('O dia de início do período deve ser de 1 a 28.');
    if (p.ptsA + p.ptsB + p.ptsC !== 100) return err(`A soma dos pontos das modalidades deve ser 100 (está ${p.ptsA + p.ptsB + p.ptsC}).`);
    const b = bonusCfg(); const old = bonusP(next);
    if (!Object.keys(p).some(k => String(p[k]) !== String(old[k]))) return err('Nenhuma alteração.');
    b.versions = b.versions.filter(v => v.from !== next); b.versions.push({ from: next, at: nowTs(), by: CUR.id, p });
    log('config', `Parâmetros da premiação alterados por ${CUR.name}, válidos a partir de ${periodName(next)}`, {});
    save(); toast(`Parâmetros salvos. Valem a partir de ${monthName(next)}.`); render();
  });
}
ACTIONS['hol-add'] = () => {
  const d = $('#hol-d').value; const n = $('#hol-n').value.trim(); if (!d || n.length < 3) return toast('Informe a data e o nome do feriado.');
  const b = bonusCfg(); if (b.holidays.some(h => h.date === d)) return toast('Este dia já está na lista.');
  const key = periodOf(parseDate(d)); if (closingOf(key)) return toast('Esse dia pertence a um período já fechado.');
  b.holidays.push({ date: d, name: n, by: CUR.id, at: nowTs() }); b.holidays.sort((x, y) => x.date < y.date ? -1 : 1);
  log('config', `Feriado incluído por ${CUR.name}: ${fmtDate(parseDate(d))} (${n})`, {}); save(); render();
};
ACTIONS['hol-del'] = a => {
  const b = bonusCfg(); const h = b.holidays.find(x => x.date === a.dataset.d); if (!h) return;
  if (closingOf(periodOf(parseDate(h.date)))) return toast('Esse dia pertence a um período já fechado.');
  b.holidays = b.holidays.filter(x => x !== h); log('config', `Feriado removido por ${CUR.name}: ${fmtDate(parseDate(h.date))} (${h.name})`, {}); save(); render();
};

/* ----- condutor: extratos divulgados (fechados) ----- */
let MY_ST = null;
async function loadMyStatements() {
  try { const { data, error } = await CLOUD.client().rpc('my_bonus_statements'); if (error) throw error; MY_ST = data || []; } catch (e) { MY_ST = []; }
}
ACTIONS['my-score'] = async () => {
  const sc = driverScore(CUR.driverId);
  const el = openModal({ title: 'Minha pontuação', wide: true, body: `${statementHTML(sc, { title: 'Período atual' })}<div id="my-st" class="stack" style="margin-top:16px"><p class="small muted">Carregando extratos fechados…</p></div>` });
  await loadMyStatements(); const box = el.querySelector('#my-st'); if (!box) return;
  box.innerHTML = MY_ST.length ? `<h3>Extratos fechados</h3>${MY_ST.map(s => `<details class="panel" style="box-shadow:none"><summary class="panel-h" style="cursor:pointer"><b>${periodName(s.month)}</b><span class="row"><span class="num">${nf(s.statement.score)} pts</span><b class="num">${money(s.statement.bonus)}</b></span></summary><div class="panel-b">${statementHTML({ ...s.statement, key: s.month, total: s.statement.score, partial: false, eligible: true }, { title: 'Extrato do período' })}</div></details>`).join('')}`
    : '<p class="small muted">Nenhum extrato fechado divulgado ainda. O extrato do período sai 3 dias após o fechamento (dia 25).</p>';
};

/* ===================== Oficinas credenciadas, manutenções (editar/excluir) e seguro do veículo ===================== */
const shopOf = id => byId(S.workshops || [], id);
const activeShops = () => (S.workshops || []).filter(w => w.active !== false).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
const shopName = (id, fallback = '') => shopOf(id)?.name || fallback || '—';
const recShop = r => r.workshopId ? shopName(r.workshopId, r.shop) : (r.shop || '—');
function shopSelect(name, sel, item) {
  const list = activeShops(); const cur = sel && shopOf(sel) && shopOf(sel).active === false ? [shopOf(sel)] : [];
  const fits = w => !item || !(w.services || []).length || (w.services || []).includes(item);
  return `<select class="inp" name="${name}" id="${name}"><option value="">Selecione a oficina credenciada</option>${[...list.filter(fits), ...list.filter(w => !fits(w)), ...cur].map(w => `<option value="${w.id}" ${w.id === sel ? 'selected' : ''}>${esc(w.name)}${w.city ? ` · ${esc(w.city)}` : ''}${w.active === false ? ' (descredenciada)' : ''}</option>`).join('')}</select>`;
}
const noShopsNote = () => `<div class="note warn">${ic('wrench')}<div>Nenhuma oficina credenciada. Os veículos só podem ir para manutenção em oficinas cadastradas. ${isManager() ? '<button type="button" class="link" data-go="oficinas">Cadastrar oficina</button>' : ''}</div></div>`;
const shopOk = id => !!id && shopOf(id)?.active !== false && !!shopOf(id);

/* ---------- página Oficinas ---------- */
PAGES.oficinas = {
  title: 'Oficinas credenciadas',
  render({ f = 'ativas' }) {
    const M = isManager(); const all = (S.workshops || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    const list = all.filter(w => f === 'todas' || (f === 'ativas' ? w.active !== false : w.active === false));

      <div class="h"><div><b>${esc(w.name)}</b><div class="model">${esc([w.city, w.cnpj ? 'CNPJ ' + cnpjFmt(w.cnpj) : ''].filter(Boolean).join(' · '))}</div></div>${w.active === false ? pill('Descredenciada') : pill('Credenciada', 'ok')}</div>
      <div class="small">${w.phone ? `<a href="tel:${esc(onlyDigits(w.phone))}">${ic('phone')} ${esc(w.phone)}</a>` : ''}${w.contact ? ` · ${esc(w.contact)}` : ''}</div>
      ${w.address ? `<div class="small muted">${esc(w.address)}</div>` : ''}
      ${(w.services || []).length ? `<div class="row" style="gap:4px">${w.services.map(s => `<span class="pill">${esc(s)}</span>`).join('')}</div>` : '<div class="tiny muted">Todos os serviços</div>'}
      <div class="foot"><span class="small muted">${st.n} serviço(s) · ${money(st.cost)}${st.now.length ? ` · <b>${st.now.map(v => v.plate).join(', ')} na oficina</b>` : ''}</span>${M ? `<button class="btn sm" data-act="ws-edit" data-id="${w.id}">${ic('edit')}Editar</button>` : ''}</div></div>`; };
    const n = k => all.filter(w => k === 'todas' || (k === 'ativas' ? w.active !== false : w.active === false)).length;

ACTIONS['ws-new'] = () => openModal({ title: 'Cadastrar oficina credenciada', wide: true, body: wsForm(), foot: '<button class="btn" data-act="modal-close">Cancelar</button><button class="btn ok" data-act="ws-save">Salvar</button>' });
ACTIONS['ws-edit'] = a => { const w = shopOf(a.dataset.id); const used = S.maintRecords.some(r => r.workshopId === w.id) || S.vehicles.some(v => v.maintenanceWorkshopId === w.id);
  openModal({ title: `Editar ${w.name}`, wide: true, body: wsForm(w), foot: `${!used ? `<button class="btn danger" data-act="ws-del" data-id="${w.id}">Excluir</button>` : ''}<button class="btn ${w.active === false ? 'pri' : 'danger'}" data-act="ws-toggle" data-id="${w.id}">${w.active === false ? 'Credenciar de novo' : 'Descredenciar'}</button><button class="btn" data-act="modal-close">Cancelar</button><button class="btn ok" data-act="ws-save" data-id="${w.id}">Salvar</button>` }); };
ACTIONS['ws-save'] = a => {
  const f = $('#ws-form'); const d = formData(f); const err = t => $('#ws-err').textContent = t;
  if ((d.name || '').length < 2) return err('Informe o nome da oficina.');
  const cnpj = onlyDigits(d.cnpj || ''); if (cnpj && !cnpjValid(cnpj)) return err('CNPJ inválido.');
  if (cnpj && (S.workshops || []).some(w => w.cnpj === cnpj && w.id !== a.dataset.id)) return err('Já existe uma oficina com este CNPJ.');
  const vals = { name: d.name, cnpj: cnpj || null, phone: d.phone, contact: d.contact, email: d.email, address: d.address, city: d.city, services: $$('input[name=sv]:checked', f).map(x => x.value) };
  if (a.dataset.id) { Object.assign(shopOf(a.dataset.id), vals); log('cadastro', `Oficina ${d.name} atualizada por ${CUR.name}`, {}); }
  else { (S.workshops = S.workshops || []).push({ id: uid(), ...vals, active: true, createdAt: nowTs() }); log('cadastro', `Oficina ${d.name} credenciada por ${CUR.name}`, {}); }
  save(); closeModal(); toast('Oficina salva.'); render();
};
ACTIONS['ws-toggle'] = a => {
  const w = shopOf(a.dataset.id); const inShop = S.vehicles.filter(v => v.maintenance && v.maintenanceWorkshopId === w.id);
  if (w.active !== false && inShop.length) return toast(`Há veículo nesta oficina (${inShop.map(v => v.plate).join(', ')}). Registre a saída antes de descredenciar.`);

// plano: itens cuja última troca veio deste registro voltam para o registro anterior do mesmo item
function planFromRecords(vid, item, skipId) {
  const prev = S.maintRecords.filter(x => x.vehicleId === vid && x.id !== skipId && x.items.includes(item)).sort((a, b) => b.at - a.at)[0];
  return prev ? { lastKm: prev.km, lastDate: startOfDay(prev.at) } : null;
}
const planIsFrom = (p, r) => p.lastKm === r.km && startOfDay(p.lastDate) === startOfDay(r.at);
ACTIONS['mr-save'] = a => {
  const r = byId(S.maintRecords, a.dataset.id); const v = veh(r.vehicleId); const f = $('#mr-form'); const d = formData(f); const err = t => $('#mr-err').textContent = t;
  const items = $$('input[name=it]:checked', f).map(x => x.value); const kmv = parseInt(onlyDigits(d.km), 10); const at = parseDate(d.date);
  if (!items.length) return err('Marque ao menos um serviço.'); if (!kmv) return err('Informe a quilometragem.'); if (!at || at > nowTs()) return err('Data inválida.');
  if (kmv > Math.max(v.odometer, r.km)) return err(`A quilometragem não pode passar do km atual do veículo (${nf(v.odometer)}).`);
  if (!shopOk(d.workshopId) && d.workshopId !== r.workshopId) return err('Escolha uma oficina credenciada.');
  if (!d.workshopId) return err('Escolha a oficina credenciada.');
  const cost = parseFloat(String(d.cost || '').replace(/\./g, '').replace(',', '.')) || 0;
  const old = { at: r.at, km: r.km, items: [...r.items], cost: r.cost, workshopId: r.workshopId, shop: r.shop, notes: r.notes || '' };
  const nat = startOfDay(at) === startOfDay(r.at) ? r.at : at + 12 * 36e5;
  // ajusta o plano: itens retirados voltam ao registro anterior; itens mantidos/novos passam a usar os novos valores
  S.plans.filter(p => p.vehicleId === v.id).forEach(p => {
    const was = old.items.includes(p.item) && planIsFrom(p, old); const now = items.includes(p.item);
    if (was && !now) { const b = planFromRecords(v.id, p.item, r.id) || r.planPrev?.[p.id]; if (b) Object.assign(p, b); }
    else if (now && (was || p.lastKm == null || kmv >= p.lastKm)) { p.lastKm = kmv; p.lastDate = startOfDay(nat); }
  });
  Object.assign(r, { at: nat, km: kmv, items, cost, workshopId: d.workshopId, shop: shopName(d.workshopId), notes: d.notes || '' });

/* ===================== Consulta por data (v1.6) =====================
   Em Veículos e Condutores: escolha um dia (ou um período) e veja quem estava com qual veículo,
   em qual obra, de que horas a que horas, e quem ficou sem uso. A fonte é o histórico de posses. */
let DQ = { from: '', to: '' };
let DQ_SEARCH = '';
const dqActive = () => !!DQ.from;
function dqRange() {
  const a = parseDate(DQ.from), b = parseDate(DQ.to || DQ.from);
  return [Math.min(a, b), Math.max(a, b) + DAY - 1];
}
function dqLabel() {
  const [a, b] = dqRange();
  return startOfDay(a) === startOfDay(b) ? fmtDate(a) : `${fmtDate(a)} a ${fmtDate(b)}`;
}
// posses que tocaram o período, com o trecho, as obras e os registros feitos nele
function dqUses() {
  const [from, to] = dqRange();
  return S.custody.filter(c => c.start <= to && (!c.end || c.end >= from)).map(c => {
    const a = Math.max(c.start, from), b = Math.min(c.end || nowTs(), to);
    const segs = c.segments || [];
    const projs = [...new Set(segs.filter((s, i) => s.at <= b && (!segs[i + 1] || segs[i + 1].at >= a)).map(s => s.projectId))].map(prj).filter(Boolean);
    const inRange = x => x.custodyId === c.id && x.at >= from && x.at <= to;
    return { c, v: veh(c.vehicleId), d: drv(c.driverId), a, b, open: !c.end && b >= nowTs() - MIN, projs, cks: S.checklists.filter(inRange).length, fuel: S.fuel.filter(inRange).length };
  }).filter(u => u.v && u.d).sort((x, y) => x.a - y.a);
}

const dqExtra = u => [u.projs.length ? u.projs.map(p => esc(p.code)).join(', ') : 'Sem obra', dqWhen(u), u.cks ? `${u.cks} checklist${u.cks > 1 ? 's' : ''}` : '', u.fuel ? `${u.fuel} abastec.` : ''].filter(Boolean).join(' · ');

/* ---------- Abastecimento (gestão) ---------- */
function fuelTable(list, emptyTxt = 'Nenhum abastecimento.') {
  return tbl(['Data', 'Veículo', 'Condutor', 'Obra', '>Km', '>Litros', '>Valor', '>km/l', '>Custo/km', '>Variação', 'Fotos'], list.sort((a, b) => b.at - a.at).slice(0, 150).map(f => {
