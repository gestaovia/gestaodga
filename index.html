/* nomes antigos: fora dos contextos de urgência tudo vira neutro */
:root{
  --blue:var(--primary); --blue-soft:var(--secondary);
  --red:var(--danger); --red-soft:var(--u-red-soft);
  --green:var(--text2); --green-soft:var(--border2);
  --amber:var(--text2); --amber-soft:var(--border2);
  --yellow:var(--text2); --yellow-soft:var(--border2);
  --orange:var(--text2); --orange-soft:var(--border2);
  --violet:var(--text2);
  --glass:var(--surface); --inv:var(--surface);
}
/* contextos onde a cor indica grau de urgência */
.urg-scope,.cal-grid,.cal-list,.cal-ev,.att,.rb-item,.sev{
  --green:var(--u-green); --green-soft:var(--u-green-soft);
  --amber:var(--u-orange); --amber-soft:var(--u-orange-soft);
  --orange:var(--u-orange); --orange-soft:var(--u-orange-soft);
  --yellow:var(--u-yellow); --yellow-soft:var(--u-yellow-soft);
}

html{font-size:14px}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700} h2{font-size:1.05rem;font-weight:700} h3{font-size:.95rem;font-weight:600} h4{font-size:.85rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)} .ink2{color:var(--text2)} .small{font-size:.84rem} .tiny{font-size:.74rem}
.label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100%}
.side{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:var(--r-sm);background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary-fg);flex-shrink:0}
.brand-mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.brand b{font-family:var(--font-sans);font-size:1.08rem;font-weight:700;letter-spacing:-.01em;line-height:1.1;display:block}
.brand span{color:var(--text2);font-size:.72rem;display:block}
.nav{flex:1;padding:6px 10px;display:flex;flex-direction:column}
.nav-group{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--text2);font-weight:500;font-size:.9rem;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--accent);color:var(--text)}
.nav button.on{background:var(--secondary);color:var(--text);font-weight:600}
.nav button svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .count{margin-left:auto;font-size:.7rem;background:var(--secondary);color:var(--text2);padding:1px 6px;border-radius:3px;font-weight:700}
.nav .count.crit{background:var(--danger);color:var(--danger-fg)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border2);font-size:.75rem;color:var(--text3);display:flex;align-items:center;gap:9px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;min-height:61px}
.top h1{font-size:1.2rem;flex-shrink:0}
.crumbs{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--text2);min-width:0}
.crumbs button{border:none;background:none;padding:0;color:var(--text2)} .crumbs button:hover{color:var(--blue)}
.top .spacer{flex:1}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s;flex-shrink:0;position:relative}
.icon-btn:hover{color:var(--text);border-color:var(--text3)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;background:var(--primary);color:var(--primary-fg);border-radius:3px;font-size:.66rem;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;height:36px;padding:0 10px 0 4px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text2);font-weight:600}
.avatar{width:30px;height:30px;border-radius:4px;background:var(--secondary);color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0}
.avatar.lg{width:46px;height:46px;border-radius:var(--r);font-size:1rem}
.who .avatar{width:26px;height:26px;border-radius:4px;font-size:.7rem}
.menu-btn{display:none}
.body-wrap{display:grid;grid-template-columns:1fr;flex:1;min-width:0}
.body-wrap.with-rb{grid-template-columns:1fr var(--rightbar-w)}
.content{padding:22px 26px 60px;min-width:0}
.rightbar{border-left:1px solid var(--border);background:var(--surface);padding:18px 16px;min-width:0}
.rb-section{margin-bottom:20px}
.rb-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.rb-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.rb-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);font-size:.8rem;margin-bottom:5px;background:var(--surface2);border:1px solid var(--border2);cursor:pointer;border-left:3px solid var(--border)}
.rb-item:hover{border-color:var(--text3)}
.rb-item small{display:block;color:var(--text3);font-size:.7rem}
.rb-item b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:.78rem}
.rb-item.warn{border-left-color:var(--yellow)} .rb-item.urg{border-left-color:var(--orange)} .rb-item.bad{border-left-color:var(--red)} .rb-item.ok{border-left-color:var(--green)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head .muted{font-size:.84rem;margin-top:2px}

/* ===== Cards ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{font-size:.98rem;font-weight:700}
.panel-b{padding:4px 18px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0;transition:box-shadow .2s,border-color .2s}
.kpi:hover{box-shadow:var(--shadow-lg)}
.kpi .l{font-size:.73rem;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.kpi .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;line-height:1.1}
.kpi .s{font-size:.72rem;color:var(--text3);margin-top:3px}
.kpi.c-red .v{color:var(--red)} .urg-scope .kpi.c-amber .v{color:var(--amber)} .urg-scope .kpi.c-orange .v{color:var(--orange)} .urg-scope .kpi.c-yellow .v{color:var(--yellow)}
.kpi.zero .v{color:var(--text3)}

.dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;font-size:.88rem}
.dl dt{color:var(--text2)} .dl dd{margin:0;min-width:0;font-weight:500}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pairs>div{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:8px 10px;min-width:0}
.pairs dt{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:700}
.pairs dd{margin:3px 0 0;font-size:.86rem;font-weight:600;overflow-wrap:anywhere}

/* ===== Tables ===== */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.tbl th{background:var(--surface2);text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);padding:10px 14px;border-bottom:1px solid var(--border);border-top:1px solid var(--border2);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}

/* plate */
.plate{font-family:var(--font-mono);display:inline-flex;flex-direction:column;border:1.5px solid var(--text);border-radius:3px;overflow:hidden;font-weight:700;line-height:1;background:var(--surface);vertical-align:middle;letter-spacing:.02em}
.plate i{display:block;height:4px;background:var(--text)}
.plate span{padding:3px 6px;font-size:.78rem;font-style:normal;font-variant-numeric:tabular-nums}
.plate.lg span{font-size:1.35rem;padding:6px 12px 7px}
.plate.lg i{height:7px}

/* status */
.st{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;white-space:nowrap;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0;display:inline-block}
.dot.ok{background:var(--green)} .dot.neu{background:var(--blue)} .dot.warn{background:var(--yellow)} .dot.urg{background:var(--orange)} .dot.bad{background:var(--red)}
.dot.gray{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text3)}
.urg-scope .dot,.cal-grid .dot{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:.73rem;font-weight:600;white-space:nowrap;background:var(--border2);color:var(--text2)}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--yellow-soft);color:var(--yellow)} .pill.urg{background:var(--orange-soft);color:var(--orange)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.neu,.pill.blue{background:var(--secondary);color:var(--text)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.sev{border-left:3px solid transparent} .sev.warn{border-left-color:var(--yellow)} .sev.urg{border-left-color:var(--orange)} .sev.bad{border-left-color:var(--red)} .sev.ok{border-left-color:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:var(--r-sm);font-weight:600;font-size:.88rem;border:1px solid var(--border);transition:all .15s;white-space:nowrap;background:var(--surface);color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--text3);background:var(--accent)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary);color:var(--primary-fg);opacity:.88}
.btn.ok{background:var(--confirm);color:var(--confirm-fg);border-color:var(--confirm)}
.btn.ok:hover{background:var(--confirm);color:var(--confirm-fg);filter:brightness(.92)}
.btn.danger{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--danger-fg);filter:brightness(.92)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:4px}
.btn.lg{padding:13px 18px;font-size:1rem;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.link{border:none;background:none;padding:0;color:var(--text);font-weight:600;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--text2)}
.field small{color:var(--text3);font-size:.74rem}
.inp{width:100%;font-size:.93rem;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 11px;outline:none;transition:border .15s,box-shadow .15s;min-height:40px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent)}
textarea.inp{min-height:76px;resize:vertical}
.inp.big{font-size:1.4rem;font-weight:700;min-height:52px;font-variant-numeric:tabular-nums}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .full{grid-column:1/-1}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--surface);font-size:.88rem;font-weight:500;min-width:44px;justify-content:center}
.seg input:checked+span{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.seg.bad input:checked+span{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.toggle{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle i{position:absolute;inset:0;background:var(--border);border-radius:3px;transition:.15s;cursor:pointer}
.toggle i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--surface);border-radius:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+i{background:var(--blue)} .toggle input:checked+i:before{transform:translateX(16px)}
.err{color:var(--red);font-size:.82rem}
.note{background:var(--surface2);border:1px solid var(--border2);padding:11px 13px;border-radius:var(--r-sm);font-size:.86rem;color:var(--text2);display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--yellow-soft);border-color:transparent;color:var(--yellow)} .note.bad{background:var(--red-soft);border-color:transparent;color:var(--red)} .note.ok{background:var(--green-soft);border-color:transparent;color:var(--green)} .note.urg{background:var(--orange-soft);border-color:transparent;color:var(--orange)} .note.neu{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.note>div{min-width:0}

/* checklist items */
.ck{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border2)}
.ck:last-child{border-bottom:0}
.ck .seg span{padding:7px 10px;font-size:.84rem;min-width:0}

/* photos */
.photos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ph{position:relative;border:2px dashed var(--border);border-radius:var(--r-sm);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface2);text-align:center;padding:6px;overflow:hidden;max-width:100%;font-size:.78rem;color:var(--text2)}
.ph:hover{border-color:var(--text2);color:var(--text);background:var(--accent)}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.done{border-style:solid;border-color:var(--text2)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:3px 5px;z-index:1}
.ph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer}

/* timeline (CliqueObras) */
.tl{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.tl:before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl li{position:relative;padding:0 0 14px 12px}
.tl li:before{content:'';position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid var(--surface)}
.tl li.ok:before{background:var(--green)} .tl li.bad:before{background:var(--red)} .tl li.warn:before{background:var(--yellow)} .tl li.urg:before{background:var(--orange)} .tl li.gray:before{background:var(--text3)}
.tl li.day{padding:6px 0 8px 12px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.tl li.day:before{display:none}
.tl .t{font-size:.74rem;color:var(--text3);font-variant-numeric:tabular-nums;font-weight:600}
.tl .x{font-size:.88rem}
.tl .x small{display:block;color:var(--text3);font-size:.75rem}

/* stepper */
.steps{display:flex;overflow-x:auto;gap:4px}
.step{flex:1;min-width:108px;font-size:.72rem;color:var(--text3);padding-top:8px;border-top:4px solid var(--border2);line-height:1.3;font-weight:500}
.step.done{border-top-color:var(--green);color:var(--text2)}
.step.cur{border-top-color:var(--blue);color:var(--blue);font-weight:700}

/* attention list */
.att{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}
.att li{display:flex;gap:11px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border2);font-size:.86rem;background:var(--surface2);align-items:center;cursor:pointer}
.att li:hover{border-color:var(--text3)}
.att .ic{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.att .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.att .ic.bad{background:var(--red-soft);color:var(--red)} .att .ic.urg{background:var(--orange-soft);color:var(--orange)} .att .ic.warn{background:var(--yellow-soft);color:var(--yellow)} .att .ic.ok{background:var(--green-soft);color:var(--green)} .att .ic.neu{background:var(--blue-soft);color:var(--blue)}
.att b{display:block;font-size:.86rem}
.att small{display:block;color:var(--text3);font-size:.75rem}
.att .when{margin-left:auto;font-size:.74rem;color:var(--text3);white-space:nowrap}

/* progress / bars */
.bar{height:6px;background:var(--border2);border-radius:2px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar.ok i{background:var(--green)} .bar.warn i{background:var(--yellow)} .bar.urg i{background:var(--orange)} .bar.bad i{background:var(--red)} .bar.gray i{background:var(--text3)}
.progress{height:7px;background:var(--border2);border-radius:3px;overflow:hidden} .progress i{display:block;height:100%;background:var(--blue);border-radius:3px}
.ring{--p:0;--c:var(--blue);width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--border2) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.ring.sm{width:40px;height:40px} .ring.sm span{width:31px;height:31px;font-size:.78rem}

/* map */
.fleet-map{height:440px;border-radius:var(--r-sm);overflow:hidden;background:var(--map-land);position:relative;z-index:0}
.fleet-map.sm{height:230px}
/* mapa OpenStreetMap: tons suaves no claro e invertido no escuro */
.osm-tiles{filter:grayscale(.35) saturate(.8)}
:root[data-theme="dark"] .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) grayscale(.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) grayscale(.3)}}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--text2);padding:10px 2px 0}
.vpin{display:flex;align-items:center;gap:0;transform:translate(-9px,-9px);white-space:nowrap}
.vpin i{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);flex-shrink:0}
.vpin b{margin-left:5px;background:var(--surface);color:var(--text);font-family:var(--font-mono);border-radius:3px;padding:2px 6px;font-size:11px;font-weight:800;letter-spacing:.04em;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ppin{width:14px;height:14px;border-radius:2px;background:var(--surface);border:2.5px solid var(--text2);transform:translate(-7px,-7px);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mlabel{font-size:10.5px;font-weight:600;color:var(--map-label);white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 3px var(--map-mun),0 0 3px var(--map-mun)}
.mlabel.proj{font-size:11px;font-weight:700;color:var(--text);transform:translate(10px,-6px);text-shadow:0 0 3px var(--map-mun),0 0 3px var(--map-mun),0 0 2px var(--map-mun)}
.leaflet-container{font-family:inherit!important;background:var(--map-land)!important}
.leaflet-popup-content-wrapper{border-radius:var(--r-sm)!important;box-shadow:var(--shadow-lg)!important}
.leaflet-popup-content{margin:12px 14px!important;font-size:.84rem;line-height:1.45}
.map-pop b{font-size:.9rem} .map-pop .muted{font-size:.76rem}

/* fleet status board */
.vlist{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--border2);cursor:pointer}
.vrow:hover{background:var(--surface2)}
.vrow .who2{min-width:0}
.vrow .who2 b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .who2 small{display:block;font-size:.74rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{display:block;font-size:.88rem} .person small{display:block;color:var(--text3);font-size:.75rem}

/* vehicle / driver cards */
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;transition:box-shadow .2s,border-color .2s}
.vcard:hover{box-shadow:var(--shadow-lg);border-color:var(--text3)}
.vcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard .h>:first-child{min-width:0;flex:1}
.vcard .model{font-size:.8rem;color:var(--text2);margin-top:6px}
.vcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.vcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--text2);border-top:1px solid var(--border2);padding-top:10px}
.ico{display:inline-flex;align-items:center;gap:4px}
.ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}

/* calendar (CliqueObras cal-grid) */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-head{font-size:.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;text-align:center;padding:5px}
.cal-day{min-height:96px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:5px;font-size:.72rem;overflow:hidden;min-width:0}
.cal-day.other{opacity:.4}
.cal-day.today{border-color:var(--primary);background:var(--accent)}
.cal-day .d{font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between}
.cal-ev{border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;background:var(--border2);color:var(--text2);border:none;display:block;width:100%;text-align:left;font-size:.7rem}
.cal-ev.warn{background:var(--yellow-soft);color:var(--yellow)} .cal-ev.urg{background:var(--orange-soft);color:var(--orange)} .cal-ev.bad{background:var(--red-soft);color:var(--red)} .cal-ev.ok{background:var(--green-soft);color:var(--green)} .cal-ev.neu{background:var(--blue-soft);color:var(--blue)} .cal-ev.rent{background:var(--accent);color:var(--text2);box-shadow:inset 2px 0 0 var(--text3)}
.cal-more{font-size:.68rem;color:var(--text3);padding-left:4px}
.cal-list{display:none}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:640px;animation:pop .18s ease-out}
.modal.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border2)}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--border2);flex-wrap:wrap}
.x-btn{border:none;background:none;font-size:22px;line-height:1;color:var(--text3);padding:2px 6px}
.toast{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:400;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);padding:11px 15px;min-width:240px;max-width:min(380px,calc(100% - 32px));font-size:.87rem;animation:slideIn .2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}}

.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border2);padding:4px;border-radius:var(--r-sm);width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:none;background:none;padding:6px 14px;border-radius:4px;font-weight:600;font-size:.83rem;color:var(--text2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-height:34px;padding:6px 10px;font-size:.84rem}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;background:var(--surface);font-size:.8rem;font-weight:600;color:var(--text2)}
.chip:hover{border-color:var(--text3);color:var(--text)}
.chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip .n{font-size:.72rem;color:var(--text3);font-weight:700}
.chip.on .n{color:inherit;opacity:.75}
.empty{text-align:center;padding:36px 20px;color:var(--text3);font-size:.88rem}

/* ===== driver (mobile-first) ===== */
.drv{max-width:540px;margin:0 auto;width:100%;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.drv-shell{min-height:100%}
.veh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.veh-card .top-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--text2)} .kv dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px;min-height:118px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;color:var(--text)}
.tile .ti{width:42px;height:42px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--text)}
.tile .ti svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tile b{font-size:1rem;display:block}
.tile small{display:block;font-size:.76rem;color:var(--text3);margin-top:2px}
.tile.primary{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;min-height:0;background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.tile.primary .ti{background:color-mix(in srgb,var(--primary-fg) 16%,transparent);color:var(--primary-fg)} .tile.primary small{color:color-mix(in srgb,var(--primary-fg) 78%,transparent)}
.tile .flag{position:absolute;top:12px;right:12px}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile:hover{border-color:var(--text3)}
.actions{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;font-size:1rem;font-weight:600;width:100%;color:var(--text);min-height:58px}
.act:hover{border-color:var(--text3)}
.act svg{width:22px;height:22px;stroke:var(--text2);fill:none;stroke-width:1.7;flex-shrink:0}
.act small{display:block;font-weight:400;font-size:.78rem;color:var(--text3)}
.act.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .act.primary svg{stroke:currentColor}
.drv .sticky-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.big-q{font-size:1.2rem;font-weight:700;text-align:center;padding:6px 0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{padding:22px;font-size:1.3rem;font-weight:700;border-radius:var(--r);border:2px solid var(--border);background:var(--surface);color:var(--text)}
.yn button.on-ok{border-color:var(--primary);background:var(--secondary);color:var(--text)}
.yn button.on-bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.scan-box{position:relative;background:#0D1117;border-radius:var(--r);aspect-ratio:1/1;overflow:hidden;display:grid;place-items:center;color:#AEB4BA;max-width:100%}
.scan-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:var(--r)}
.scan-box svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5}
.qr-list{display:flex;flex-wrap:wrap;gap:8px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.login-l{background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding:48px clamp(16px,6vw,80px);gap:22px;border-right:1px solid var(--border)}
.login-r{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.qr-img{background:#fff;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);display:inline-block;line-height:0}
.qr-img svg,.qr-img img{width:132px;height:132px}

.hide-d{display:none}
@media (max-width:1200px){.body-wrap.with-rb{grid-template-columns:1fr}.rightbar{border-left:0;border-top:1px solid var(--border)}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);height:100%}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:55}
  .menu-btn{display:inline-flex}
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .content{padding:16px 16px 40px}
  .top{padding:10px 16px}
  .photos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hide-m{display:none}
  .hide-d{display:initial}
  .login{grid-template-columns:1fr}
  .login-l{border-right:0;border-bottom:1px solid var(--border);padding-block:28px}
  .login-r{padding-block:24px}
  .fleet-map{height:340px}
}
@media (max-width:640px){
  .cal-grid.month{display:none}
  .cal-list{display:flex;flex-direction:column;gap:8px}
  .form-grid,.form-grid.three{grid-template-columns:1fr}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .who .nm{display:none}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:8px}
  .modal-bg{padding:0;align-items:stretch}
  .modal{max-width:none;border-radius:0;min-height:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top h1{font-size:1.05rem}
}

/* ===== Tema neutro: ajustes finais ===== */
.kpi .v{color:var(--text)}
.kpi.c-red .v{color:var(--red)}
.urg-scope .kpi.c-amber .v{color:var(--amber)} .urg-scope .kpi.c-orange .v{color:var(--orange)} .urg-scope .kpi.c-yellow .v{color:var(--yellow)}
.kpi.zero .v{color:var(--text3)}
.kpi:hover{border-color:var(--text3);box-shadow:var(--shadow)}
.panel,.kpi,.vcard,.veh-card,.tile,.act{box-shadow:none}
.top h1{flex-shrink:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login h1{font-family:var(--font-serif);letter-spacing:0}
.theme-fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:50}
.icon-btn[data-act="theme"] svg{width:17px;height:17px}
.tbl-wrap{-webkit-overflow-scrolling:touch}
.tbl th{letter-spacing:.04em}
.side{padding-top:env(safe-area-inset-top,0px)}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.drv{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
img,video,canvas{max-width:100%}

/* toque: alvos maiores em celulares e tablets */
@media (pointer:coarse){
  .btn{min-height:42px}
  .btn.sm{min-height:36px}
  .icon-btn{width:40px;height:40px}
  .nav button{padding:11px 12px}
  .chip{min-height:36px}
  .tabs button{min-height:36px}
}

/* celulares */
@media (max-width:640px){
  html{font-size:14.5px}
  .inp,select.inp,textarea.inp,.filters .inp{font-size:16px}
  .top{gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:56px}
  .content{padding:14px 12px calc(40px + env(safe-area-inset-bottom,0px))}
  .page-head{align-items:stretch}
  .page-head>.row,.page-head>.filters{width:100%}
  .page-head .row>.inp{flex:1 1 160px;width:auto!important;min-width:0}
  .filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters>*{flex-shrink:0}
  .panel-h{padding:12px 14px 8px}
  .panel-b{padding:4px 14px 14px}
  .vrow{padding:10px 14px}
  .tbl th,.tbl td{padding:9px 10px}
  .modal-h{padding:14px 16px;position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-b{padding:16px}
  .modal-f{position:sticky;bottom:0;background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .modal-f .btn{flex:1 1 0;min-width:0}
  .toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0;max-width:none}
  .fleet-map{height:300px}
  .rightbar{padding:16px 12px}
  .drv{padding:14px 12px calc(32px + env(safe-area-inset-bottom,0px))}
  .steps .step{min-width:92px}
  .login-l,.login-r{padding-inline:16px}
}
@media (max-width:420px){
  .who{display:none}
  .kpi{padding:11px 12px}
  .kpi .v{font-size:1.3rem}
  .tile{padding:14px;min-height:104px}
  .yn button{padding:18px}

}
@media (max-width:360px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .tiles{gap:8px}
  .top .icon-btn{width:36px;height:36px}
  .brand b{font-size:1rem}
}

/* placa não estica dentro de cartões; mapa acompanha o tema */
.vcard .h>.plate,.vcard .h>button>.plate{flex:0 0 auto}
.kpis{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-bar{border:1px solid var(--border)!important;box-shadow:none!important;border-radius:var(--r-sm)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--text3)!important}
.leaflet-control-attribution a{color:var(--text2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface)!important;color:var(--text)!important;border-radius:var(--r)!important}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== Cor com propósito (09/10/2026) =====
   Pontuação: verde, amarelo, laranja, vermelho nos minigráficos (anel, barras e número).
   Escanear veículo: verde, a ação principal do condutor. O resto continua neutro. */
.bar.s-ok i{background:var(--u-green)} .bar.s-warn i{background:var(--u-yellow)} .bar.s-urg i{background:var(--u-orange)} .bar.s-bad i{background:var(--u-red)}
.kpi.s-ok .v{color:var(--u-green)} .kpi.s-warn .v{color:var(--u-yellow)} .kpi.s-urg .v{color:var(--u-orange)} .kpi.s-bad .v{color:var(--u-red)}
.tile.scan{background:var(--confirm);border-color:var(--confirm);color:var(--confirm-fg)}
.tile.scan .ti{background:color-mix(in srgb,var(--confirm-fg) 18%,transparent);color:var(--confirm-fg)}
.tile.scan small{color:color-mix(in srgb,var(--confirm-fg) 85%,transparent)}
.tile.scan:hover{border-color:var(--confirm);filter:brightness(.94)}
.icon-btn.scan{color:var(--confirm);border-color:color-mix(in srgb,var(--confirm) 45%,var(--border))}
.icon-btn.scan:hover{color:var(--confirm);border-color:var(--confirm)}

/* ---------- marca, entrada e abertura ---------- */
.brand-logo{width:36px;height:36px;border-radius:9px;flex-shrink:0;object-fit:contain}
.org-logo{width:36px;height:36px;border-radius:6px;object-fit:contain;background:#fff;flex-shrink:0}
.login1{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px 24px}
.login-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.login-logo{width:88px;height:88px;border-radius:20px}

.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--text2);animation:gvspin .8s linear infinite}
@keyframes gvspin{to{transform:rotate(360deg)}}
.avatar.img{padding:0;overflow:hidden;background:var(--border2)}
.avatar.img img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:72px;height:72px;border-radius:12px;font-size:1.4rem}
.top .icon-btn .avatar{width:100%;height:100%;border-radius:inherit}

/* v1.5 · marca GestaoVia sempre visível */
.org-line{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:7px 8px;border-radius:6px;background:var(--surface2);font-size:.78rem;color:var(--text2);font-weight:600;min-width:0}
.org-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-logo.sm{width:22px;height:22px;border-radius:4px}
.brand-c{display:flex;align-items:center;gap:9px;min-width:0}.brand-c .brand-logo{width:32px;height:32px;border-radius:8px}
.brand-c b{display:block;font-size:.95rem;line-height:1.1}.brand-c small{display:block;font-size:.72rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.top-logo{display:none;width:28px;height:28px;border-radius:7px}
@media (max-width:1000px){.top-logo{display:block}}
/* v1.5 · premiação, seguro, manutenção */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mod-card{display:flex;flex-direction:column;gap:7px;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.pill.mod-A,.pill.mod-B,.pill.mod-C{font-weight:800;min-width:22px;justify-content:center}
.pill.mod-A{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.pill.mod-B{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.pill.mod-C{background:color-mix(in srgb,var(--u-orange) 20%,transparent);color:var(--u-orange)}
tr.abonado td{opacity:.62}
.tbl.calc td{padding:7px 12px}.tbl.calc td:first-child{color:var(--text2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ins-crit{border:1.5px solid var(--red)}
.ins-calls .btn{justify-content:flex-start;text-decoration:none}
a.btn{text-decoration:none}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.mod-card>.row>b.num{white-space:nowrap}
.ins-calls .btn{flex-wrap:wrap;height:auto;min-height:48px;white-space:normal;text-align:left}

/* v1.6 · janela não fecha ao clicar fora: balança para indicar Cancelar ou Concluir */
@keyframes gvnudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.modal.nudge{animation:gvnudge .32s ease-in-out}
@media (prefers-reduced-motion:reduce){.modal.nudge{animation:none;box-shadow:0 0 0 2px var(--ring)}}

/* v1.6 · status do veículo: amarelo = disponível, verde = com condutor, vermelho = com problema (sempre colorido) */
.dot.vs-free{background:var(--u-yellow)} .dot.vs-drv{background:var(--u-green)} .dot.vs-prob{background:var(--u-red)}
.pill.vs-free{background:var(--u-yellow-soft);color:var(--u-yellow)} .pill.vs-drv{background:var(--u-green-soft);color:var(--u-green)} .pill.vs-prob{background:var(--u-red-soft);color:var(--u-red)}

/* v1.6 · consulta por data (Veículos e Condutores) */
.dq-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}

.dq-idle{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}

  .modal-b{flex:1 0 auto}
}

<script>
"use strict";
/* ===================== Núcleo: utilitários, estado e rótulos ===================== */
const DAY = 864e5, MIN = 6e4;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => window.crypto?.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const pad = n => String(n).padStart(2, '0');
const nowTs = () => Date.now();
const fmtDate = t => { if (!t) return '—'; const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtTime = t => { if (!t) return '—'; const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDT = t => t ? `${fmtDate(t)} às ${fmtTime(t)}` : '—';
const fmtShort = t => { if (!t) return '—'; const d = new Date(t); return isToday(t) ? `hoje ${fmtTime(t)}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${fmtTime(t)}`; };
const nf = (n, d = 0) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const km = n => n == null ? '—' : nf(n) + ' km';
const money = n => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isToday = t => startOfDay(t) === startOfDay(nowTs());
const startOfMonth = t => { const d = new Date(t); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dur = ms => { if (ms < 0) ms = 0; const m = Math.floor(ms / MIN); if (m < 60) return `${m} min`; const h = Math.floor(m / 60); if (h < 48) return `${h} h ${pad(m % 60)} min`; return `${Math.floor(h / 24)} dias`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (a, f = x => x) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const byId = (arr, id) => arr.find(x => x.id === id);

/* ----- rótulos ----- */
const ROLES = { admin: 'Administrador', gestor: 'Gestor de Frota', supervisor: 'Supervisor', condutor: 'Condutor' };
// cor do status do veículo: amarelo = disponível, verde = com condutor, vermelho = com problema
const V_STATUS = {
  disponivel: { l: 'Disponível', c: 'vs-free' }, em_uso: { l: 'Em uso', c: 'vs-drv' }, deslocamento: { l: 'Em deslocamento', c: 'vs-drv' },
  parado: { l: 'Parado', c: 'gray' }, aguardando_transferencia: { l: 'Aguardando transferência', c: 'vs-drv' },
  manutencao: { l: 'Em manutenção', c: 'gray' }, bloqueado: { l: 'Bloqueado', c: 'vs-prob' }, pendencia: { l: 'Com pendência', c: 'vs-prob' }
};
const VS_LEGEND = [['vs-free', 'Disponível'], ['vs-drv', 'Com condutor'], ['vs-prob', 'Com problema'], ['gray', 'Em manutenção']];
const T_STATUS = [
  ['posse', 'Posse ativa'], ['solicitada', 'Transferência solicitada'], ['aguardando_entrega', 'Aguardando entrega'],
  ['entrega_andamento', 'Checklist de entrega em andamento'], ['aguardando_recebimento', 'Aguardando recebimento'],
  ['recebimento_andamento', 'Checklist de recebimento em andamento'], ['concluida', 'Transferência concluída']
];
const T_LABEL = Object.fromEntries([...T_STATUS, ['cancelada', 'Cancelada']]);
const CK_TYPES = {
  recebimento: 'Recebimento', entrega: 'Entrega', devolucao: 'Devolução', diario: 'Diário',
  manut_entrada: 'Entrada em manutenção', manut_saida: 'Saída de manutenção', avaria: 'Registro de avaria'
};
const CK_ITEMS = [
  ['pneus', 'Estado dos pneus'], ['farois', 'Faróis e lanternas'], ['vidros', 'Vidros'], ['retrovisores', 'Retrovisores'],
  ['lataria', 'Lataria'], ['limpeza', 'Limpeza'], ['estepe', 'Estepe'], ['ferramentas', 'Ferramentas (macaco, chave, triângulo)'], ['documentacao', 'Documentação (CRLV)']
];
const PHOTO_SLOTS = [['frontal', 'Frontal'], ['traseira', 'Traseira'], ['lat_dir', 'Lateral direita'], ['lat_esq', 'Lateral esquerda'], ['painel', 'Painel com hodômetro']];
const FUEL_LEVELS = ['Reserva', '1/4', '1/2', '3/4', 'Cheio'];
const PURPOSES = ['Deslocamento para obra', 'Transporte de equipe', 'Transporte de materiais', 'Visita técnica', 'Serviço administrativo', 'Retorno à matriz'];
const PROBLEM_TYPES = ['Freios', 'Pneus', 'Motor', 'Elétrica / painel', 'Iluminação', 'Lataria / avaria', 'Vazamento', 'Suspensão / direção', 'Documentação', 'Outro'];
const SEVERITY = { baixa: { l: 'Baixa', c: 'gray' }, media: { l: 'Média', c: 'warn' }, alta: { l: 'Alta', c: 'urg' }, critica: { l: 'Crítica', c: 'bad' } };
const MAINT_ITEMS = ['Troca de óleo', 'Filtros', 'Alinhamento', 'Balanceamento', 'Pneus', 'Revisão', 'Correia dentada', 'Freios', 'Bateria', 'Outros'];
const M_LEVEL = { normal: { l: 'Normal', c: 'gray', r: 0 }, atencao: { l: 'Atenção', c: 'warn', r: 1 }, urgente: { l: 'Urgente', c: 'urg', r: 2 }, vencido: { l: 'Vencido', c: 'bad', r: 3 } };
const FINE_TYPES = { leve: 88.38, media: 130.16, grave: 195.23, gravissima: 293.47 };


/* ----- estado (carregado do Supabase em 11-cloud.js) ----- */
let S = null;
// toda alteração é enviada ao servidor (só as diferenças, numa transação)
function save() { if (CLOUD.on) CLOUD.queue(); }

function log(type, text, o = {}) {
  S.audit.push({ id: uid('log'), at: o.at || nowTs(), type, text, vehicleId: o.vehicleId || null, driverId: o.driverId || null, userId: o.userId ?? (CUR?.id || 'sistema'), data: o.data || null });
}
function notify(to, text, o = {}) {
  S.notifications.push({ id: uid('ntf'), to, text, at: o.at || nowTs(), read: false, level: o.level || 'info', link: o.link || null });
}

/* ===================== Regras de negócio ===================== */
const drv = id => byId(S.drivers, id);
const veh = id => byId(S.vehicles, id);
const prj = id => byId(S.projects, id);
const ccOf = id => byId(S.costCenters, id);
const userName = uidv => { if (!uidv || uidv === 'sistema') return 'Sistema'; const u = byId(S.users, uidv); return u ? u.name : (isUUID(uidv) ? 'Equipe da frota' : uidv); };

// A posse é a fonte de verdade da responsabilidade
const activeCustody = vid => S.custody.find(c => c.vehicleId === vid && !c.end) || null;
const driverCustodies = did => S.custody.filter(c => c.driverId === did && !c.end);
const custodyAt = (vid, ts) => S.custody.find(c => c.vehicleId === vid && c.start <= ts && (!c.end || ts < c.end)) || null;
const segmentAt = (c, ts) => c ? (c.segments.filter(s => s.at <= ts).at(-1) || null) : null;
const currentSegment = c => c ? (c.segments.at(-1) || null) : null;
const activeTransfer = vid => S.transfers.find(t => t.vehicleId === vid && !['concluida', 'cancelada'].includes(t.status)) || null;
const openIssues = vid => S.issues.filter(i => i.vehicleId === vid && i.status === 'aberta');
const vehicleByPlate = p => S.vehicles.find(v => v.plate === String(p).toUpperCase().replace(/[^A-Z0-9]/g, ''));

function vStatus(v) {
  const iss = openIssues(v.id);
  if (iss.some(i => !i.canRun)) return 'bloqueado';
  if (v.maintenance) return 'manutencao';
  if (activeTransfer(v.id)) return 'aguardando_transferencia';
  if (iss.some(i => ['alta', 'critica'].includes(i.severity))) return 'pendencia';
  const c = activeCustody(v.id);
  if (c) {
    const loc = S.locations[v.id];
    if (loc && nowTs() - loc.at < 10 * MIN && loc.speed > 10) return 'deslocamento';
    return 'em_uso';
  }
  return 'disponivel';
}
function dailyDoneToday(vid) {
  const c = activeCustody(vid); if (!c) return null;
  return S.checklists.find(k => k.vehicleId === vid && k.custodyId === c.id && ['diario', 'recebimento'].includes(k.type) && isToday(k.at)) || null;
}
function needsDaily(v) { const c = activeCustody(v.id); return !!c && !v.maintenance && !dailyDoneToday(v.id); }
function lastChecklist(vid) { return S.checklists.filter(k => k.vehicleId === vid).sort((a, b) => b.at - a.at)[0] || null; }

/* ----- manutenção ----- */
function planState(p) {
  const v = veh(p.vehicleId); const m = S.settings.maint;
  let lvl = 'normal', remKm = null, nextKm = null, nextDate = null, remDays = null;
  const rank = l => M_LEVEL[l].r;
  if (p.everyKm && p.lastKm != null) {
    nextKm = p.lastKm + p.everyKm; remKm = nextKm - v.odometer;
    const l = remKm <= 0 ? 'vencido' : remKm <= m.urgentKm ? 'urgente' : remKm <= m.attentionKm ? 'atencao' : 'normal';
    if (rank(l) > rank(lvl)) lvl = l;
  }
  if (p.everyDays && p.lastDate) {
    nextDate = p.lastDate + p.everyDays * DAY; remDays = Math.floor((nextDate - startOfDay(nowTs())) / DAY);
    const l = remDays < 0 ? 'vencido' : remDays <= m.urgentDays ? 'urgente' : remDays <= m.attentionDays ? 'atencao' : 'normal';
    if (rank(l) > rank(lvl)) lvl = l;
  }
  return { lvl, remKm, nextKm, nextDate, remDays };
}
function vehicleMaint(vid) {
  const items = S.plans.filter(p => p.vehicleId === vid).map(p => ({ p, s: planState(p) })).sort((a, b) => M_LEVEL[b.s.lvl].r - M_LEVEL[a.s.lvl].r || (a.s.remKm ?? 1e9) - (b.s.remKm ?? 1e9));
  const worst = items[0]?.s.lvl || 'normal';
  const next = items.filter(x => x.s.remKm != null).sort((a, b) => a.s.remKm - b.s.remKm)[0] || null;
  return { items, worst, next };
}

/* ----- abastecimento ----- */
function fuelMetrics(f) {
  const prev = S.fuel.filter(x => x.vehicleId === f.vehicleId && x.at < f.at).sort((a, b) => b.at - a.at)[0];
  const v = veh(f.vehicleId);
  if (!prev) return { dist: null, kmL: null, costKm: null, delta: null, avg: v.avgKmL };
  const dist = f.km - prev.km;
  const kmL = dist > 0 ? dist / f.liters : null;
  const costKm = dist > 0 ? f.total / dist : null;
  const avg = vehicleAvgKmL(f.vehicleId, f.at) || v.avgKmL;
  const delta = kmL ? (kmL - avg) / avg * 100 : null;
  return { dist, kmL, costKm, delta, avg };
}
function vehicleAvgKmL(vid, before = Infinity) {
  const fs = S.fuel.filter(x => x.vehicleId === vid && x.at < before).sort((a, b) => a.at - b.at);
  if (fs.length < 3) return veh(vid).avgKmL;
  const first = fs[0], last = fs.at(-1);
  const liters = sum(fs.slice(1), x => x.liters);
  return liters > 0 ? (last.km - first.km) / liters : veh(vid).avgKmL;
}
const fuelOutlier = f => { const m = fuelMetrics(f); return m.delta != null && Math.abs(m.delta) > S.settings.fuelDeviationPct ? m : null; };

/* ----- cruzamento pedágio / multa com a posse ----- */
function matchAt(plate, ts) {
  const v = vehicleByPlate(plate); if (!v) return { v: null };
  const c = custodyAt(v.id, ts);
  if (!c) return { v, c: null };
  const sg = segmentAt(c, ts);
  return { v, c, driverId: c.driverId, projectId: sg?.projectId || null, ccId: sg?.ccId || null };
}
function tollMatch(t) {
  if (t.manual) return { ...t.manual, how: 'manual' };
  const m = matchAt(t.plate, t.at);
  if (!m.c) return { how: 'sem', vehicleId: m.v?.id };
  return { how: 'auto', vehicleId: m.v.id, driverId: m.driverId, projectId: m.projectId, ccId: m.ccId, custodyId: m.c.id };
}
function fineMatch(f) {
  const m = matchAt(f.plate, f.at);
  if (f.manualDriverId) return { how: 'manual', vehicleId: m.v?.id, driverId: f.manualDriverId, projectId: f.manualProjectId || m.projectId, custodyId: m.c?.id };
  if (!m.c) return { how: 'sem', vehicleId: m.v?.id };
  return { how: 'auto', vehicleId: m.v.id, driverId: m.driverId, projectId: m.projectId, custodyId: m.c.id, custody: m.c };
}

/* ----- custos e indicadores ----- */
function periodCosts(from, to) {
  const inP = t => t >= from && t < to;
  const rows = [];
  S.fuel.filter(f => inP(f.at)).forEach(f => rows.push({ kind: 'Combustível', value: f.total, vehicleId: f.vehicleId, driverId: f.driverId, projectId: f.projectId }));
  S.tolls.filter(t => inP(t.at)).forEach(t => { const m = tollMatch(t); rows.push({ kind: 'Pedágios', value: t.value, vehicleId: m.vehicleId, driverId: m.driverId, projectId: m.projectId }); });
  S.fines.filter(f => inP(f.at)).forEach(f => { const m = fineMatch(f); rows.push({ kind: 'Multas', value: f.value, vehicleId: m.vehicleId, driverId: m.driverId, projectId: m.projectId }); });
  S.maintRecords.filter(r => inP(r.at)).forEach(r => { const c = custodyAt(r.vehicleId, r.at); rows.push({ kind: 'Manutenção', value: r.cost, vehicleId: r.vehicleId, driverId: null, projectId: c ? segmentAt(c, r.at)?.projectId : null }); });
  rows.push(...docCosts(from, to));
  return rows;
}
function kmInPeriod(from, to, filter = () => true) {
  // km rodados = soma dos trechos de posse dentro do período (proporcional quando a posse cruza o período)
  let total = 0;
  S.custody.filter(filter).forEach(c => {
    const end = c.end || nowTs(); const endKm = c.endKm ?? veh(c.vehicleId).odometer;

/* cor da pontuação: verde (90+, faixa do adicional), amarelo (70+), laranja (50+), vermelho */
function scoreTone(s) { return s >= 90 ? 'ok' : s >= 70 ? 'warn' : s >= 50 ? 'urg' : 'bad'; }
const SCORE_VAR = { ok: '--u-green', warn: '--u-yellow', urg: '--u-orange', bad: '--u-red' };

/* ----- locação ----- */
function rentalState(v) {
  if (v.ownership !== 'locada' || !v.rental || v.rental.status !== 'ativa') return null;
  const days = Math.floor((v.rental.dueDate - startOfDay(nowTs())) / DAY);
  const R = S.settings.rental;
  const lvl = days < 0 ? 'vencido' : days <= R.urgentDays ? 'urgente' : days <= R.warnDays ? 'atencao' : 'normal';
  return { days, lvl };
}

/* ----- projeção de manutenção pelo uso médio ----- */
function avgDailyKm(vid) {
  const now = nowTs(); const km = kmInPeriod(now - 30 * DAY, now, c => c.vehicleId === vid);
  return km > 100 ? km / 30 : 45;
}
function planDue(p) {
  const s = planState(p); const today = startOfDay(nowTs());
  let date = null, basis = '';
  if (s.remKm != null) { const d = today + Math.max(0, Math.round(s.remKm / avgDailyKm(p.vehicleId))) * DAY; date = d; basis = 'km'; }
  if (s.nextDate != null && (date == null || s.nextDate < date)) { date = startOfDay(s.nextDate); basis = 'data'; }
  if (s.lvl === 'vencido' && date > today) date = today;
  return { ...s, date, basis };
}

/* ----- lista "Atenção necessária" ----- */
function attentionItems() {
  const out = [];
  const [dh, dm] = deadlineNow().split(':').map(Number);
  const pastDeadline = new Date().getHours() * 60 + new Date().getMinutes() > dh * 60 + dm;
  S.issues.filter(i => i.status === 'aberta').forEach(i => {
    const v = veh(i.vehicleId);
    out.push({ c: i.severity === 'critica' || !i.canRun ? 'bad' : i.severity === 'alta' ? 'urg' : 'warn', r: i.severity === 'critica' ? 10 : 6, icon: 'alert', title: `${v.plate} · ${i.type}`, sub: `Problema ${SEVERITY[i.severity].l.toLowerCase()}${i.canRun ? '' : ' · bloqueado'}`, text: `Veículo ${v.plate} possui problema ${SEVERITY[i.severity].l.toLowerCase()}: ${i.type}.`, at: i.at, go: { page: 'veiculo', id: v.id } });
  });
  S.vehicles.forEach(v => {
    const c = activeCustody(v.id);
    if (c && !c.segments.length) out.push({ c: 'urg', r: 7, icon: 'pin', title: `${v.plate} sem obra`, sub: drv(c.driverId).name, text: `Veículo ${v.plate} está sem obra vinculada.`, at: c.start, go: { page: 'veiculo', id: v.id } });
    if (needsDaily(v)) out.push({ c: pastDeadline ? 'urg' : 'warn', r: pastDeadline ? 5 : 3, icon: 'check', title: `${v.plate} sem checklist hoje`, sub: `${drv(c.driverId).name}${pastDeadline ? ` · prazo ${deadlineNow()}` : ''}`, text: `Veículo ${v.plate} está sem checklist hoje.`, at: null, go: { page: 'veiculo', id: v.id } });
    vehicleMaint(v.id).items.filter(x => ['urgente', 'vencido'].includes(x.s.lvl)).forEach(({ p, s }) => {
      const sub = s.lvl === 'vencido' ? (s.remKm != null && s.remKm <= 0 ? `Vencida há ${nf(-s.remKm)} km` : `Vencida há ${-s.remDays} dias`) : (s.remKm != null && s.remKm <= S.settings.maint.urgentKm ? `Faltam ${nf(s.remKm)} km` : `Faltam ${s.remDays} dias`);
      out.push({ c: M_LEVEL[s.lvl].c, r: s.lvl === 'vencido' ? 8 : 4, icon: 'wrench', title: `${v.plate} · ${p.item}`, sub, text: `Veículo ${v.plate}: ${p.item} — ${sub.toLowerCase()}.`, at: null, go: { page: 'calendario', vid: v.id } });
    });
    const rs = rentalState(v);
    if (rs && rs.lvl !== 'normal') out.push({ c: M_LEVEL[rs.lvl].c, r: rs.lvl === 'vencido' ? 9 : rs.lvl === 'urgente' ? 6 : 2, icon: 'key', title: `${v.plate} · locação`, sub: rs.days < 0 ? `Devolução vencida há ${-rs.days} dias` : rs.days === 0 ? 'Devolver ou renovar hoje' : `Devolver ou renovar em ${rs.days} dias`, text: `Locação do ${v.plate} vence em ${rs.days} dias.`, at: null, go: { page: 'veiculo', id: v.id } });
  });
  S.transfers.filter(t => !['concluida', 'cancelada'].includes(t.status)).forEach(t => {
    const age = nowTs() - t.requestedAt; const late = age > S.settings.transferAlertHours * 36e5;
    const who = ['solicitada', 'aguardando_entrega', 'entrega_andamento'].includes(t.status) ? drv(t.fromDriverId).name : drv(t.toDriverId).name;
    out.push({ c: late ? 'urg' : 'warn', r: late ? 6 : 3, icon: 'swap', title: `${veh(t.vehicleId).plate} · transferência`, sub: `${who} · ${T_LABEL[t.status].toLowerCase()} há ${dur(age)}`, text: `Condutor ${who} possui transferência pendente.`, at: t.requestedAt, go: { page: 'transferencia', id: t.id } });
  });
  (S.trackerEvents || []).filter(e => nowTs() - e.at < DAY && ['overspeed', 'sos', 'powerCut', 'tampering'].includes(e.type)).forEach(e => out.push({ c: e.type === 'overspeed' ? 'urg' : 'bad', r: e.type === 'overspeed' ? 4 : 9, icon: 'gauge', title: `${veh(e.vehicleId).plate} · ${ALARM_LABEL[e.type]}`, sub: `${e.speed ? e.speed + ' km/h · ' : ''}${e.driverId ? drv(e.driverId).name : 'sem condutor'}`, text: '', at: e.at, go: { page: 'veiculo', id: e.vehicleId } }));
  S.fuel.filter(f => nowTs() - f.at < 7 * DAY).forEach(f => { const m = fuelOutlier(f); if (m && m.delta < 0) out.push({ c: 'warn', r: 2, icon: 'fuel', title: `${veh(f.vehicleId).plate} · consumo alto`, sub: `${nf(m.kmL, 1)} km/l (${nf(m.delta, 0)}% da média)`, text: '', at: f.at, go: { page: 'abastecimento' } }); });
  const unT = S.tolls.filter(t => tollMatch(t).how === 'sem').length;
  if (unT) out.push({ c: 'warn', r: 1, icon: 'toll', title: `${unT} pedágio(s) sem condutor`, sub: 'Aguardam ajuste manual', text: '', at: null, go: { page: 'pedagios', f: 'sem' } });
  const unF = S.fines.filter(f => fineMatch(f).how === 'sem').length;
  if (unF) out.push({ c: 'warn', r: 1, icon: 'fine', title: `${unF} multa(s) sem condutor`, sub: 'Sem posse no horário', text: '', at: null, go: { page: 'multas' } });
  out.push(...docAttention());
  return out.sort((a, b) => b.r - a.r);
}
function fleetCounts() {
  const st = S.vehicles.map(v => ({ v, s: vStatus(v) }));
  return {
    total: S.vehicles.length,
    emUso: S.vehicles.filter(v => activeCustody(v.id)).length,
    disp: st.filter(x => x.s === 'disponivel').length,
    manut: S.vehicles.filter(v => v.maintenance).length,
    manutVenc: S.vehicles.filter(v => vehicleMaint(v.id).worst === 'vencido').length,
    pend: S.vehicles.filter(v => openIssues(v.id).length).length,
    semCk: S.vehicles.filter(needsDaily).length,
    semObra: S.vehicles.filter(v => { const c = activeCustody(v.id); return c && !c.segments.length; }).length,
    locados: S.vehicles.filter(v => v.ownership === 'locada' && v.rental?.status === 'ativa').length,
    locVence: S.vehicles.filter(v => { const r = rentalState(v); return r && r.lvl !== 'normal'; }).length
  };
}

/* ----- última localização registrada (celular do condutor no checklist) ----- */
function lastLocation(vid) {
  // posição mais recente: envio automático do celular do condutor ou localização registrada no checklist
  const k = S.checklists.filter(x => x.vehicleId === vid && x.location).sort((a, b) => b.at - a.at)[0];
  const t = S.locations[vid]; const v = veh(vid);
  const fromT = t ? { lat: t.lat, lng: t.lng, at: t.at, source: 'celular', what: `GPS do condutor${t.speed > 3 ? ` · ${t.speed} km/h` : ''}`, driverId: null } : null;
  const fromK = k ? { lat: k.location.lat, lng: k.location.lng, at: k.at, source: k.location.source, what: `Checklist ${CK_TYPES[k.type].toLowerCase()}`, driverId: k.driverId } : null;

/* ----- localização ----- */
function currentLocation(vid) {
  const l = S.locations[vid]; if (!l) return null;
  return { lat: l.lat, lng: l.lng, source: l.source || 'celular', at: l.at };
}

  let best = null, bd = 1e9;

// redimensiona a foto antes do envio (economiza dados móveis e armazenamento)
function readPhoto(file, maxW = 640) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width); const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .62));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- regras de posse ---------- */
function receiveCheck(v, did) {
  const c = activeCustody(v.id); const t = activeTransfer(v.id);
  if (drv(did)?.active === false) return { ok: false, msg: 'Seu cadastro de condutor está inativo. Procure a gestão da frota.' };
  if (c && c.driverId === did) return { ok: false, mine: true, msg: 'Este veículo já está sob sua responsabilidade.' };
  if (v.maintenance) return { ok: false, msg: 'Veículo em manutenção. O recebimento só é liberado após o checklist de saída da manutenção.' };
  if (openIssues(v.id).some(i => !i.canRun)) return { ok: false, msg: 'Veículo bloqueado por problema crítico. Aguarde a liberação da gestão.' };
  if (c) return { ok: false, other: c, t, msg: `Veículo atualmente sob responsabilidade de ${drv(c.driverId).name}. Para receber este veículo, o atual responsável deve realizar a entrega.` };
  if (t && t.toDriverId !== did) return { ok: false, t, msg: `Existe uma transferência em andamento para ${drv(t.toDriverId).name}.` };
  if (S.settings.oneVehiclePerDriver) { const mine = driverCustodies(did); if (mine.length) return { ok: false, msg: `Você já está com o veículo ${veh(mine[0].vehicleId).plate}. Entregue-o antes de receber outro.` }; }

/* ---------- Scanner ---------- */
let CAM = null;
function stopCamera() { if (CAM) { CAM.stream?.getTracks().forEach(t => t.stop()); cancelAnimationFrame(CAM.raf); CAM = null; } }
function resolveCode(txt) {
  const s = String(txt || '').trim().toUpperCase();
  const m = s.match(/VLK1-[A-Z0-9]{16}/);
  if (m) {
    const q = S.qrcodes.find(q => q.token === m[0]);
    if (!q) return { err: 'QR Code não reconhecido.' };
    if (!q.active) return { err: 'Este QR Code foi substituído e não é mais válido. Procure a gestão da frota.' };
    return { vid: q.vehicleId };
  }
  const v = vehicleByPlate(s); if (v) return { vid: v.id };
  return { err: 'Código não reconhecido. Confira a placa ou o QR Code.' };
}
function onScanned(txt) {
  const r = resolveCode(txt);
  if (r.err) { const el = $('#scan-err'); if (el) el.textContent = r.err; else toast(r.err); return; }
  stopCamera();
  log('qr', `QR Code lido por ${CUR.name}`, { vehicleId: r.vid, driverId: CUR.driverId });
  save(); go('scan_result', { vid: r.vid });
}

    const box = $('#scan-box'); $('#scan-idle').hidden = true;
    const video = document.createElement('video'); video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;

    await video.play();

        c.width = video.videoWidth; c.height = video.videoHeight; x.drawImage(video, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height); const code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });

    };
    loop();
  } catch (e) {
    msg.textContent = 'A câmera não está disponível neste navegador ou a permissão foi negada. Use a leitura por foto ou digite a placa.';

  return ck;
}
const showErrors = e => { const el = $('#ck-err'); el.innerHTML = e.map(x => `<div>${esc(x)}</div>`).join(''); el.hidden = !e.length; if (e.length) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); };

/* ---------- Recebimento ---------- */

      const ck = saveFullChecklist('recebimento', v, did, c.id, k);

};

/* ---------- Entrega ---------- */
PAGES.entregar = {
  driver: true, title: 'Entrega do veículo',
  render({ vid, tid }) {
    const d = myDriver(); const cs = d ? driverCustodies(d.id) : [];
    vid = vid || cs[0]?.vehicleId;
    if (!vid) return `<div class="drv"><h1>Entregar veículo</h1><div class="note">Você não está com nenhum veículo.</div></div>`;
    const v = veh(vid); const c = activeCustody(vid);
    if (!c || c.driverId !== CUR.driverId) return `<div class="drv"><h1>Entregar veículo</h1><div class="note bad">Somente o condutor responsável pode entregar este veículo.</div></div>`;
    const t = tid ? byId(S.transfers, tid) : activeTransfer(vid);
    if (!DRAFT || DRAFT.kind !== 'entregar') {
      newDraft('entregar', vid, { mode: t ? 'transfer' : 'devolucao' });
      if (t && t.status === 'solicitada') { setTransfer(t, 'aguardando_entrega', 'Condutor atual aceitou a solicitação'); }
      if (t && t.status === 'aguardando_entrega') { setTransfer(t, 'entrega_andamento', 'Checklist de entrega iniciado'); log('transferencia', `${drv(c.driverId).name} iniciou o checklist de entrega`, { vehicleId: vid, driverId: c.driverId }); save(); }

    }

      ${t ? `<div class="note">Entrega para <b>${esc(drv(t.toDriverId).name)}</b>. Após este checklist sua posse é encerrada e ${esc(drv(t.toDriverId).name.split(' ')[0])} poderá fazer o recebimento.</div>` : `<div class="note">Devolução do veículo. Após este checklist sua posse é encerrada e o veículo fica disponível.</div>`}
      ${ckHeader(v, `<dt>Obra atual</dt><dd>${seg ? projLabel(seg.projectId) : projLabel(null)}</dd><dt>Posse desde</dt><dd>${fmtDT(c.start)}</dd><dt>Km inicial</dt><dd class="num">${km(c.startKm)}</dd>`)}
      ${fullChecklistBody(v)}
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button type="button" class="btn lg" data-go="inicio">Depois</button><button class="btn ok lg" style="flex:1">Concluir entrega</button></div>

  mount({ vid, tid }) {

      e.preventDefault();

/* ---------- Checklist diário ---------- */
PAGES.diario = {
  driver: true, title: 'Checklist diário',
  render({ vid }) {
    const d = myDriver(); vid = vid || (d && driverCustodies(d.id)[0]?.vehicleId);
    const v = vid && veh(vid); const c = v && activeCustody(vid);
    if (!v || !c || (d && c.driverId !== d.id)) return `<div class="drv"><h1>Checklist diário</h1><div class="note">O checklist diário é feito pelo condutor responsável pelo veículo. Escaneie o veículo para começar.</div><button class="btn ok lg block" data-go="scanner">Escanear veículo</button></div>`;
    if (!DRAFT || DRAFT.kind !== 'diario') { newDraft('diario', vid, { answer: null, projOk: '1', projectId: currentSegment(c)?.projectId || '', ccId: currentSegment(c)?.ccId || '', type: '', desc: '', severity: '', canRun: '' }); captureLocation(v); }
    const done = dailyDoneToday(vid); const seg = currentSegment(c); const D = DRAFT;
    const sim = D.answer === 'sim', nao = D.answer === 'nao';
    return `<form class="drv" id="dform" novalidate>
      <div class="veh-card"><div class="top-line">${plate(v.plate, true)}<span class="pill ok">Veículo identificado</span></div>
        <dl class="kv"><dt>Condutor</dt><dd>${esc(drv(c.driverId).name)}</dd><dt>Obra atual</dt><dd>${seg ? projFull(seg.projectId) : projLabel(null)}</dd><dt>Data</dt><dd>${fmtDT(nowTs())}</dd></dl></div>
      ${done ? `<div class="note ok">Checklist de hoje já registrado às ${fmtTime(done.at)}. Você pode registrar outro se a situação mudou.</div>` : ''}
      <p class="big-q">O veículo está em condições normais de utilização?</p>
      <div class="yn"><button type="button" class="${sim ? 'on-ok' : ''}" data-act="d-ans" data-v="sim">Sim</button><button type="button" class="${nao ? 'on-bad' : ''}" data-act="d-ans" data-v="nao">Não</button></div>
      ${D.answer ? `
      <div class="panel"><div class="panel-b stack" style="gap:12px">
        <label class="field"><span>Quilometragem atual</span><input class="inp big num" name="km" inputmode="numeric" value="${D.km ?? ''}"><small>Confira no painel ou envie a foto abaixo.</small></label>
        ${singlePhoto('painel_d', 'Foto do painel (opcional)')}
      </div></div>` : ''}
      ${sim ? `<div class="panel"><div class="panel-b stack" style="gap:10px">
        <span class="field"><span>Confirmar obra</span></span>
        <div class="seg"><label><input type="radio" name="projOk" value="1" ${D.projOk === '1' ? 'checked' : ''}><span>Continuo em ${seg ? esc(prj(seg.projectId).code) : '—'}</span></label><label><input type="radio" name="projOk" value="0" ${D.projOk === '0' ? 'checked' : ''}><span>Mudar obra</span></label></div>
        <div id="proj-change" ${D.projOk === '0' || !seg ? '' : 'hidden'}><select class="inp" name="projectId"><option value="">Selecione a obra</option>${projectOptions(D.projectId)}</select></div>
      </div></div>` : ''}
      ${nao ? `<div class="panel"><div class="panel-h"><h3>Descreva o problema</h3></div><div class="panel-b stack" style="gap:14px">${problemFields()}</div></div>` : ''}
      <div class="note bad" id="ck-err" hidden role="alert"></div>
      ${D.answer ? `<div class="sticky-foot"><button class="btn ok lg block">Finalizar checklist</button></div>` : ''}
    </form>`;
  },
  mount({ vid }) {
    const f = $('#dform'); if (!f) return; bindDraft(f);
    f.addEventListener('change', e => { if (e.target.name === 'projOk') { const pc = $('#proj-change'); if (pc) pc.hidden = e.target.value !== '0'; } });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = veh(DRAFT.vid); const c = activeCustody(v.id); const D = DRAFT; const errs = [];
      const k = parseInt(String(D.km).replace(/\D/g, ''), 10);
      if (!k && !D.photos.painel_d) errs.push('Informe a quilometragem ou envie a foto do painel.');
      if (k && k < lastRecordedKm(v.id)) errs.push(`A quilometragem não pode ser menor que o último registro (${km(lastRecordedKm(v.id))}).`);
      if (D.answer === 'sim' && (D.projOk === '0' || !currentSegment(c)) && !D.projectId) errs.push('Selecione a obra.');
      if (D.answer === 'nao') errs.push(...problemErrors());
      if (errs.length) return showErrors(errs);
      const kmv = k || suggestedKm(v);
      const [h, m] = deadlineNow().split(':').map(Number); const n = new Date();
      const ck = { id: uid('ck'), type: 'diario', vehicleId: v.id, driverId: c.driverId, userId: CUR.id, custodyId: c.id, at: nowTs(), km: kmv, ok: D.answer === 'sim', problem: null, photos: { painel: D.photos.painel_d || null }, location: D.geo, late: n.getHours() * 60 + n.getMinutes() > h * 60 + m };
      S.checklists.push(ck); v.odometer = Math.max(v.odometer, kmv);
      if (D.answer === 'sim') {
        log('checklist', `Checklist diário: condições normais (${nf(kmv)} km)${ck.late ? ' · fora do prazo' : ''}`, { vehicleId: v.id, driverId: c.driverId });
        const seg = currentSegment(c);
        if ((D.projOk === '0' || !seg) && D.projectId && D.projectId !== seg?.projectId) changeProject(c, D.projectId, prj(D.projectId).ccId, seg?.purpose || PURPOSES[0]);
        save(); toast('Checklist diário concluído.'); go('inicio');
      } else {
        const iss = createIssue(v, c.driverId, 'diario');
        ck.problem = { issueId: iss.id };
        log('checklist', `Checklist diário: veículo com problema (${nf(kmv)} km)`, { vehicleId: v.id, driverId: c.driverId });
        save(); const crit = iss.severity === 'critica' || !iss.canRun; toast(crit ? 'Problema crítico registrado. A gestão foi alertada.' : 'Checklist registrado com o problema informado.'); crit ? go('seguro', { vid: v.id }) : go('inicio');
      }
    });
  }
};
ACTIONS['d-ans'] = a => { DRAFT.answer = a.dataset.v; go('diario', { vid: DRAFT.vid }, { keepDraft: true, noPush: true }); };

function problemFields() {
  const D = DRAFT;
  return `<div class="field"><span>Tipo de problema</span><div class="seg">${PROBLEM_TYPES.map(t => `<label><input type="radio" name="type" value="${t}" ${D.type === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div>
    <label class="field"><span>Descrição</span><textarea class="inp" name="desc" placeholder="O que aconteceu? Onde está o problema?">${esc(D.desc)}</textarea></label>
    <div class="field"><span>Criticidade</span><div class="seg">${Object.entries(SEVERITY).map(([k, s]) => `<label><input type="radio" name="severity" value="${k}" ${D.severity === k ? 'checked' : ''}><span>${s.l}</span></label>`).join('')}</div><small>Crítica gera alerta imediato para o gestor e abre o acionamento do seguro.</small></div>
    ${singlePhoto('problema', 'Foto do problema')}
    <div class="field"><span>O veículo pode continuar circulando?</span><div class="seg bad"><label><input type="radio" name="canRun" value="1" ${D.canRun === '1' ? 'checked' : ''}><span>Sim</span></label><label><input type="radio" name="canRun" value="0" ${D.canRun === '0' ? 'checked' : ''}><span>Não, veículo parado</span></label></div></div>`;
}
function problemErrors() {
  const e = []; const D = DRAFT;
  if (!D.type) e.push('Selecione o tipo de problema.');
  if (!D.desc || D.desc.length < 5) e.push('Descreva o problema.');
  if (!D.severity) e.push('Informe a criticidade.');
  if (!D.canRun) e.push('Informe se o veículo pode continuar circulando.');
  return e;
}
function createIssue(v, driverId, source) {
  const D = DRAFT;
  const iss = { id: uid('iss'), vehicleId: v.id, driverId, at: nowTs(), type: D.type, desc: D.desc, severity: D.severity, canRun: D.canRun === '1', photo: D.photos.problema || null, status: 'aberta', source, location: D.geo };
  S.issues.push(iss);
  log('problema', `Problema ${SEVERITY[iss.severity].l.toLowerCase()} informado: ${iss.type} – ${iss.desc}${iss.canRun ? '' : '. Veículo não pode circular'}`, { vehicleId: v.id, driverId });
  if (iss.severity === 'critica' || !iss.canRun) notify('gestao', `Problema ${iss.severity === 'critica' ? 'CRÍTICO' : SEVERITY[iss.severity].l.toLowerCase()} no ${v.plate} (${iss.type})${iss.canRun ? '' : ': veículo não pode circular'}. Informado por ${drv(driverId)?.name || CUR.name}.`, { level: 'bad', link: { page: 'veiculo', id: v.id } });
  return iss;
}

/* ---------- Informar problema ---------- */

/* ---------- Checklist completo avulso: avaria, entrada e saída de manutenção ---------- */

      : type === 'manut_saida' ? `<div class="panel"><div class="panel-h"><h3>Serviços realizados</h3></div><div class="panel-b stack" style="gap:12px">

          <div class="form-grid"><label class="field"><span>Custo total (R$)</span><input class="inp num" name="cost" inputmode="decimal" value="${esc(DRAFT.cost)}"></label><label class="field"><span>Oficina credenciada</span>${shopSelect('workshopId', DRAFT.workshopId)}</label></div></div></div>` : '';
    const wrap = CUR.role === 'condutor' ? 'drv' : 'drv" style="margin:0;max-width:760px';
    return `<form class="${wrap}" id="ckform" novalidate>

      <div class="note bad" id="ck-err" hidden role="alert"></div>
      <div class="sticky-foot"><button type="button" class="btn lg" data-go="${CUR.role === 'condutor' ? 'inicio' : 'veiculo'}" data-id="${vid}">Cancelar</button><button class="btn ok lg" style="flex:1">Concluir</button></div>
    </form>`;
  },
